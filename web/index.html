<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Device Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030305 !important;
            color: #ededed !important;
            overflow: hidden;
            user-select: none;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-panel {
            background: rgba(12, 12, 18, 0.85);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #controlPanel {
            background: rgba(22, 22, 24, 0.94);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 24px 54px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .corner-marker {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .corner-tl {
            top: 28px;
            left: 28px;
            border-top: 1px solid;
            border-left: 1px solid;
        }

        .corner-tr {
            top: 28px;
            right: 28px;
            border-top: 1px solid;
            border-right: 1px solid;
        }

        .corner-bl {
            bottom: 28px;
            left: 28px;
            border-bottom: 1px solid;
            border-left: 1px solid;
        }

        .corner-br {
            bottom: 28px;
            right: 28px;
            border-bottom: 1px solid;
            border-right: 1px solid;
        }
    </style>
</head>

<body class="w-screen h-screen relative flex items-center justify-between">

    <!-- 四角工程定位符 -->
    <div class="corner-marker corner-tl"></div>
    <div class="corner-marker corner-tr"></div>
    <div class="corner-marker corner-bl"></div>
    <div class="corner-marker corner-br"></div>

    <!-- 顶部状态栏 -->
    <header class="absolute top-8 left-12 z-10 flex items-center space-x-4 pointer-events-auto cursor-pointer group"
        ondblclick="toggleFullScreen()" title="双击此处切换浏览器全屏/窗口模式">
        <div class="flex items-center space-x-2">
            <div class="w-1.5 h-1.5 rounded-full bg-white animate-pulse group-hover:scale-150 transition-transform">
            </div>
            <span
                class="text-xs uppercase tracking-widest text-zinc-300 mono group-hover:text-white transition-colors">BLUEBOX
                CHAMIL [双击全屏]</span>
        </div>
        <span class="text-zinc-700">/</span>
        <span class="text-xs text-zinc-500 mono" id="system-status">NODES ONLINE</span>
    </header>

    <!-- 初始中央状态指引胶囊 -->
    <div id="initialHintPill"
        class="absolute top-10 left-1/2 -translate-x-1/2 z-10 pointer-events-none transition-all duration-500">
        <div
            class="px-4 py-1.5 rounded-full bg-white/[0.03] border border-white/10 backdrop-blur-md flex items-center space-x-3 text-xs text-zinc-400 mono shadow-2xl">
            <span class="w-1.5 h-1.5 rounded-full bg-zinc-300 animate-ping"></span>
            <span>SPACE UNIVERSE READY · SELECT NODE TO INSPECT</span>
        </div>
    </div>

    <!-- 右上角：实时系统遥测参数 -->
    <div
        class="absolute top-8 right-12 z-10 hidden md:flex items-center space-x-6 text-xs mono text-zinc-500 pointer-events-none">
        <div>ARCH: <span class="text-zinc-300">CENTRALIZED</span></div>
        <div>BUS: <span class="text-zinc-300">12ms</span></div>
        <div id="liveClock" class="text-zinc-400">00:00:00</div>
    </div>

    <!-- 左下角：微型拓扑状态统计卡片 -->
    <div
        class="absolute bottom-16 left-12 z-10 pointer-events-none hidden lg:flex items-center space-x-3 px-3.5 py-2 rounded-xl glass-panel text-[11px] mono text-zinc-400 shadow-xl">
        <span class="text-zinc-200 font-medium tracking-wider">TOPOLOGY:</span>
        <span class="text-zinc-400">CORE: <strong class="text-zinc-200">1</strong></span>
        <span class="text-zinc-700">/</span>
        <span class="text-zinc-400">NODES: <strong class="text-zinc-200" id="nodeCount">0</strong></span>
    </div>

    <!-- 底部操作提示 -->
    <footer class="absolute bottom-8 left-12 z-10 pointer-events-none flex items-center space-x-6">
        <p class="text-sm text-zinc-500 tracking-wider">点击任意设备节点以聚焦控制面板 · 双击左上角标题切换全屏</p>
        <span class="text-zinc-800">|</span>
        <span class="text-xs text-zinc-600 mono">SYS.GRID // v2.6.2</span>
    </footer>

    <!-- 主画布 -->
    <main class="w-full h-full relative cursor-grab active:cursor-grabbing" id="canvas-container">
        <canvas id="universeCanvas" class="block w-full h-full"></canvas>
    </main>

    <!-- 动态控制面板（空容器，由子页面完全填充） -->
    <aside id="controlPanel"
        class="absolute w-[540px] rounded-2xl z-30 opacity-0 pointer-events-none scale-95 translate-y-3 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] shadow-2xl"
        style="background: rgba(22, 22, 24, 0.94); backdrop-filter: blur(36px); border: 1px solid rgba(255,255,255,0.14);">
        <!-- 内容完全由子页面动态填充 -->
    </aside>

    <script>
        // ========== 全屏切换 ==========
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`全屏切换失败: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // ========== 时钟更新 ==========
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // ========== Canvas 初始化 ==========
        const canvas = document.getElementById('universeCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ========== 核心节点 ==========
        const coreNode = {
            id: 'BLUEBOX-CORE',
            name: 'BLUEBOX CHAMIL',
            type: 'Master Core',
            address: '192.168.1.1',
            rssi: '0 dBm',
            x: 0.50,
            y: 0.50,
            radius: 30,
            baseAlpha: 1.0,
            fieldScale: 1,
            isCore: true,
            worldX: 0,
            worldY: 0,
            vx: 0,
            vy: 0,
            breathPhase: Math.random() * Math.PI * 2,
            breathSpeed: 0.012,
            panelFile: 'devices/root.html',
            status: 'online'
        };

        let externalDevices = [];
        let nodes = [coreNode];

        // 服务器地址
        // const BASE_URL = 'http://192.168.164.128:8080';  // 公司
        const BASE_URL = 'http://192.168.12.138:8080';  // 家
        const DEVICE_ID = 1;

        // ---------- WebSocket 与轮询 ----------
        let ws = null;
        let wsReconnectTimer = null;
        let pollTimer = null;
        let wsReconnectDelay = 2000;
        const POLL_INTERVAL = 10000;

        const bus = new EventTarget();
        window.dataBus = bus;

        let commandPending = false;

        // ========== 环境粒子 ==========
        const ambientParticles = Array.from({ length: 200 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.08,
            vy: (Math.random() - 0.5) * 0.08,
            radius: 1.0 + Math.random() * 1.5,
            alpha: 0.1 + Math.random() * 0.2
        }));

        let focusedNode = null;
        let activePanelIsOnRight = true;
        let mouse = { x: -1000, y: -1000, hoverNode: null };

        let camera = {
            x: 0, y: 0, zoom: 1.0,
            targetX: 0, targetY: 0, targetZoom: 1.0
        };

        const panelContentCache = {};

        // ========== 加载核心节点配置 ==========
        async function loadCoreDevice(path) {
            try {
                const html = await (await fetch(path)).text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const configScript = doc.querySelector('script[type="application/json"].device-config');
                if (configScript) {
                    const config = JSON.parse(configScript.textContent);
                    coreNode.id = config.id || coreNode.id;
                    coreNode.name = config.name || coreNode.name;
                    coreNode.type = config.type || coreNode.type;
                    coreNode.address = config.address || coreNode.address;
                    coreNode.rssi = config.rssi || coreNode.rssi;
                    coreNode.status = config.status || coreNode.status;
                    coreNode.radius = config.radius !== undefined ? config.radius : coreNode.radius;
                    coreNode.baseAlpha = config.baseAlpha !== undefined ? config.baseAlpha : coreNode.baseAlpha;
                    coreNode.panelOffsetX = config.panelOffsetX !== undefined ? config.panelOffsetX : 35;
                    coreNode.panelOffsetY = config.panelOffsetY !== undefined ? config.panelOffsetY : 0;
                    coreNode.fieldScale = coreNode.radius / 30;
                }
                if (configScript) configScript.remove();
                panelContentCache[path] = doc.body.innerHTML;
                coreNode.panelFile = path;
            } catch (err) {
                console.warn('加载核心节点配置失败:', err);
            }
        }

        // ========== 从 devices/ 加载设备配置 ==========
        async function loadDevices() {
            try {
                const response = await fetch('devices.json');
                const devicePaths = await response.json();

                const rootPath = devicePaths.find(path => path.includes('root.html'));
                const externalPaths = devicePaths.filter(path => !path.includes('root.html'));
                const totalDevices = externalPaths.length;

                if (rootPath) await loadCoreDevice(rootPath);

                const angleStep = (Math.PI * 2) / Math.max(totalDevices, 1);
                const radiusMin = 0.18;
                const radiusMax = 0.38;

                const loadPromises = externalPaths.map(async (path, index) => {
                    try {
                        const htmlResponse = await fetch(path);
                        const htmlContent = await htmlResponse.text();
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlContent, 'text/html');
                        const configScript = doc.querySelector('script[type="application/json"].device-config');
                        if (!configScript) {
                            console.warn(`设备文件 ${path} 中未找到设备配置，跳过`);
                            return null;
                        }
                        const deviceConfig = JSON.parse(configScript.textContent);
                        if (deviceConfig.radius === undefined) deviceConfig.radius = 12;
                        if (deviceConfig.baseAlpha === undefined) deviceConfig.baseAlpha = 0.9;

                        if (deviceConfig.x === undefined || deviceConfig.y === undefined) {
                            const angle = index * angleStep + (Math.random() - 0.5) * 0.4;
                            const radius = radiusMin + Math.random() * (radiusMax - radiusMin);
                            deviceConfig.x = 0.5 + Math.cos(angle) * radius;
                            deviceConfig.y = 0.5 + Math.sin(angle) * radius;
                        }
                        deviceConfig.worldX = (deviceConfig.x - 0.5) * 1200;
                        deviceConfig.worldY = (deviceConfig.y - 0.5) * 800;
                        deviceConfig.vx = (Math.random() - 0.5) * 0.15;
                        deviceConfig.vy = (Math.random() - 0.5) * 0.15;
                        deviceConfig.breathPhase = Math.random() * Math.PI * 2;
                        deviceConfig.breathSpeed = 0.012 + Math.random() * 0.015;
                        deviceConfig.panelFile = path;
                        deviceConfig.isCore = false;
                        deviceConfig.panelOffsetX = deviceConfig.panelOffsetX || 35;
                        deviceConfig.panelOffsetY = deviceConfig.panelOffsetY || 0;

                        configScript.remove();
                        const panelContent = doc.body.innerHTML;
                        panelContentCache[path] = panelContent;
                        return deviceConfig;
                    } catch (err) {
                        console.error(`加载设备文件 ${path} 失败:`, err);
                        return null;
                    }
                });

                const loadedDevices = await Promise.all(loadPromises);
                externalDevices = loadedDevices.filter(d => d !== null);
                nodes = [coreNode, ...externalDevices];
                document.getElementById('nodeCount').innerText = externalDevices.length;
                document.getElementById('system-status').innerText = `${externalDevices.length + 1} NODES ONLINE`;
                console.log(`已加载 ${externalDevices.length} 个外部设备节点`);
            } catch (err) {
                console.error('加载 devices.json 失败:', err);
            }
        }

        // ========== 加载面板内容到控制面板（整个面板） ==========
        async function loadPanelContent(devicePath) {
            const panel = document.getElementById('controlPanel');

            if (panelContentCache[devicePath]) {
                panel.innerHTML = panelContentCache[devicePath];
                executePanelScripts(panel);
                return;
            }

            try {
                const res = await fetch(devicePath);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const html = await res.text();
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const cfgEl = doc.querySelector('script[type="application/json"].device-config');
                if (cfgEl) cfgEl.remove();
                const panelContent = doc.body.innerHTML;
                panelContentCache[devicePath] = panelContent;
                panel.innerHTML = panelContent;
                executePanelScripts(panel);
            } catch (err) {
                console.error('加载面板失败:', err);
                panel.innerHTML = `<div class="text-center text-zinc-500 py-10 text-sm mono">加载失败: ${err.message}</div>`;
            }
        }

        // ========== 执行面板内的脚本 ==========
        function executePanelScripts(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(script => {
                if (script.type && script.type !== 'text/javascript' && script.type !== '') return;
                const newScript = document.createElement('script');
                if (script.src) {
                    newScript.src = script.src;
                } else {
                    newScript.textContent = script.textContent;
                }
                script.parentNode.replaceChild(newScript, script);
            });
        }

        // ========== 鼠标交互 ==========
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            if (focusedNode) return;

            let worldMouseX = (mouse.x - width / 2) / camera.zoom + camera.x;
            let worldMouseY = (mouse.y - height / 2) / camera.zoom + camera.y;

            let found = null;
            for (let node of nodes) {
                let dx = node.worldX - worldMouseX;
                let dy = node.worldY - worldMouseY;
                let hitRadius = node.isCore
                    ? Math.max(120, (node.radius || 30) * 4)
                    : Math.max(35, (node.radius || 12) * 3);
                if (Math.sqrt(dx * dx + dy * dy) < hitRadius) {
                    found = node;
                    break;
                }
            }
            mouse.hoverNode = found;
            canvas.style.cursor = found ? 'pointer' : 'grab';
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
            mouse.hoverNode = null;
        });

        canvas.addEventListener('click', () => {
            if (mouse.hoverNode && !focusedNode) {
                selectNode(mouse.hoverNode);
            }
        });

        // ========== 选择节点 ==========
        function selectNode(node) {
            focusedNode = node;
            camera.targetZoom = 2.6;
            camera.targetX = node.worldX + (width * 0.15) / 2.6;
            camera.targetY = node.worldY;

            const hintPill = document.getElementById('initialHintPill');
            hintPill.style.opacity = '0';
            hintPill.style.transform = 'translate(-50%, -20px)';

            // 直接加载整个面板内容
            if (node.panelFile) {
                loadPanelContent(node.panelFile);
            } else {
                const panel = document.getElementById('controlPanel');
                panel.innerHTML = `<div class="text-center text-zinc-500 py-10 text-sm mono">该设备暂无控制面板</div>`;
            }

            // 保存当前节点供子页面使用（子页面可通过它读取初始名称等）
            window._currentPanelNode = node;
        }

        // ========== 关闭面板 ==========
        function closePanel() {
            if (!focusedNode) return;
            const panel = document.getElementById('controlPanel');
            panel.classList.add('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-3');

            const hintPill = document.getElementById('initialHintPill');
            hintPill.style.opacity = '1';
            hintPill.style.transform = 'translate(-50%, 0)';

            camera.targetZoom = 1.0;
            camera.targetX = 0;
            camera.targetY = 0;

            focusedNode = null;
            window._currentPanelNode = null;
        }

        // ========== 设备状态轮询 ==========
        async function fetchDeviceStatus(deviceId = DEVICE_ID) {
            try {
                const url = `${BASE_URL}/api/device/${deviceId}`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                window.sharedData.MyReceiveData = data;
            } catch (err) {
                console.error('[Poll] 获取设备状态失败:', err);
            }
        }

        function startPolling() {
            if (pollTimer) return;
            console.log('[Poll] 开始轮询');
            fetchDeviceStatus();
            pollTimer = setInterval(fetchDeviceStatus, POLL_INTERVAL);
        }

        function stopPolling() {
            if (pollTimer) {
                console.log('[Poll] 停止轮询');
                clearInterval(pollTimer);
                pollTimer = null;
            }
        }

        // ========== WebSocket 连接 ==========
        function wsUrl() {
            return BASE_URL.replace(/^http/, 'ws') + '/ws';
        }

        function connectWebSocket() {
            try {
                ws = new WebSocket(wsUrl());
            } catch (e) {
                console.error('[WS] 连接创建失败:', e.message);
                scheduleReconnect();
                return;
            }

            ws.onopen = () => {
                console.log('[WS] 已连接');
                wsReconnectDelay = 2000;
                stopPolling();
                fetchDeviceStatus();
            };

            ws.onmessage = (ev) => {
                console.log('[WS] 收到消息:', ev.data);
                let data;
                try {
                    data = JSON.parse(ev.data);
                } catch (e) {
                    return;
                }

                window.sharedData.MyReceiveData = data;
            };

            ws.onerror = (err) => {
                console.error('[WS] 连接错误:', err);
            };

            ws.onclose = () => {
                console.log('[WS] 断开连接');
                ws = null;
                startPolling();
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            if (wsReconnectTimer) return;
            wsReconnectTimer = setTimeout(() => {
                wsReconnectTimer = null;
                console.log('[WS] 尝试重连...');
                connectWebSocket();
            }, wsReconnectDelay);
            wsReconnectDelay = Math.min(wsReconnectDelay * 2, 15000);
        }

        // ========== 共享数据 ==========
        function createReactive(target, bus) {
            return new Proxy(target, {
                set(obj, prop, value) {
                    obj[prop] = value;
                    bus.dispatchEvent(new CustomEvent(prop + 'Changed', {
                        detail: { [prop]: value }
                    }));
                    return true;
                }
            });
        }

        window.sharedData = createReactive({
            MyReceiveData: null, //网页收到的信息
            MySerAdv: null, //子设备发出的信息
            MyDeviceInfoAdv: null,//更新除去状态之外的信息
            device_1_info: {
                id: 1,
                name: null,
                online: null,
                capabilities: null,
                fw_version: null,
                mac: null,
                model: null,
                state: null,
                type: null,
            },
            //这个是保存id1的初始信息的，id2需要另外的参数存储，这个和MyDeviceInfoAdv作用不一样
            //因为如果没有打开子页面却传入了多个设备信息，最开始的信息会丢失
        }, bus);

        const requiredFields = ['name', 'online', 'capabilities', 'fw_version', 'mac', 'model', 'type'];

        function isValidDeviceData(data, ...fieldNames) {
            // 如果第一个参数是数组，则将其展开为字段列表
            if (fieldNames.length === 1 && Array.isArray(fieldNames[0])) {
                fieldNames = fieldNames[0];
            }
            // 如果没有任何字段，直接返回 false（或 true 取决于业务）
            if (fieldNames.length === 0) return false;

            // 检查所有字段是否存在
            const allExist = fieldNames.every(field => data.hasOwnProperty(field));
            if (!allExist) return false;

            // 递归检查字段值是否有效（非空）
            function isValueValid(value) {
                if (value === null || value === undefined) return false;
                if (typeof value === 'string' && value.trim() === '') return false;
                if (typeof value === 'object' && !Array.isArray(value)) {
                    for (let key in value) {
                        if (value.hasOwnProperty(key) && !isValueValid(value[key])) {
                            return false;
                        }
                    }
                    return true;
                }
                if (Array.isArray(value)) {
                    for (let item of value) {
                        if (!isValueValid(item)) return false;
                    }
                    return true;
                }
                return true;
            }

            // 对每个必需字段的值进行递归校验
            for (let field of fieldNames) {
                if (!isValueValid(data[field])) return false;
            }
            return true;
        }

        bus.addEventListener('MyReceiveDataChanged', (e) => {
            const data = e.detail.MyReceiveData;
            console.log('主页面收到的数据:', data);


            //这里有问题，即使发状态也会进入

            // 这里用于更新页面初始化参数
            if (data.id === 1) {
                const info = window.sharedData.device_1_info;
                // 如果存在字段会更新 device_1_info 初始值
                // device_1_info 是子页面初始值不参与实时更新
                requiredFields.forEach(field => {
                    if (isValidDeviceData(data, field)) {
                        info[field] = data[field];
                        // console.log('设备1初始化设备信息:', data[field]);
                    }
                });

                // 3. 【特殊处理】state：仅当 device_1_info 中还没有 state 时才写入初始值
                //    这样后续开关灯、调色等高频操作不会污染 device_1_info 的“初始状态”
                if (isValidDeviceData(data, 'state') && !info.state) {
                    info.state = data.state;
                    // console.log('设备1初始化state信息:', data.state);
                }

            }

            // 这里用于实时更新状态数据
            window.sharedData.MyDeviceInfoAdv = data;


        });

        bus.addEventListener('MySerAdvChanged', (e) => {
            console.log('主页面收到其他页面的发送数据:', e.detail.MySerAdv);
            sendCommand(DEVICE_ID, e.detail.MySerAdv);
        });

        // ---------- 发送控制指令 ----------
        async function sendCommand(deviceId, partialState) {
            if (commandPending) {
                console.warn('[CMD] 上一条指令尚未完成，请稍后');
                return;
            }
            if (!deviceId) {
                console.error('[CMD] 无效的设备ID');
                return;
            }
            commandPending = true;
            try {
                const payload = { ...partialState };
                const url = `${BASE_URL}/api/device/${deviceId}/cmd`;
                const body = JSON.stringify(payload);
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                });
                const text = await response.text();
                console.log(`[CMD] POST ${url} -> ${response.status} ${text}`);
                console.log(`[CMD] BODY ${body}`);
                if (!response.ok) {
                    console.warn('[CMD] 指令未成功，设备可能保持原状态');
                } else {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        fetchDeviceStatus(deviceId);
                    }
                }
            } catch (err) {
                console.error('[CMD] 发送指令异常:', err);
            } finally {
                commandPending = false;
            }
        }

        // ========== 全局辅助函数 ==========
        function handleDeviceToggle(checkbox, deviceId) {
            console.log(`设备 ${deviceId} 状态切换: ${checkbox.checked ? '开启' : '关闭'}`);
        }

        function toggleRelayChannel(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerText = el.innerText === '关闭' ? '开启' : '关闭';
            }
        }

        function toggleUSBPort(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerText = el.innerText === '开启' ? '关闭' : '开启';
            }
        }

        // ========== 动画循环 ==========
        let rotationAngle = 0;
        let radarWavePhase = 0;

        function animate() {
            ctx.clearRect(0, 0, width, height);
            rotationAngle += 0.003;
            radarWavePhase += 0.025;

            camera.x += (camera.targetX - camera.x) * 0.08;
            camera.y += (camera.targetY - camera.y) * 0.08;
            camera.zoom += (camera.targetZoom - camera.zoom) * 0.08;

            // 背景渐变
            let bgGlow = ctx.createRadialGradient(width * 0.5, height * 0.5, 50, width * 0.5, height * 0.5, width * 0.7);
            bgGlow.addColorStop(0, 'rgba(25, 25, 38, 0.22)');
            bgGlow.addColorStop(1, 'rgba(3, 3, 5, 0)');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, width, height);

            // 网格点
            ctx.fillStyle = 'rgba(255, 255, 255, 0.018)';
            const gridSize = 64;
            for (let x = 32; x < width; x += gridSize) {
                for (let y = 32; y < height; y += gridSize) {
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            // 环境粒子
            ambientParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;
                ctx.fillStyle = `rgba(255, 255, 255, ${focusedNode ? p.alpha * 0.25 : p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 节点间连线
            ctx.lineWidth = 0.5;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let dx = nodes[i].worldX - nodes[j].worldX;
                    let dy = nodes[i].worldY - nodes[j].worldY;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 450) {
                        let sx1 = (nodes[i].worldX - camera.x) * camera.zoom + width / 2;
                        let sy1 = (nodes[i].worldY - camera.y) * camera.zoom + height / 2;
                        let sx2 = (nodes[j].worldX - camera.x) * camera.zoom + width / 2;
                        let sy2 = (nodes[j].worldY - camera.y) * camera.zoom + height / 2;

                        let isConnectedToHover = (nodes[i] === mouse.hoverNode || nodes[j] === mouse.hoverNode);
                        let isConnectedToFocused = focusedNode && (nodes[i] === focusedNode || nodes[j] === focusedNode);

                        let lineAlpha = 0.04 * (1 - dist / 450);
                        if (nodes[i].isCore || nodes[j].isCore) lineAlpha *= 2.2;
                        if (isConnectedToHover) lineAlpha = 0.3;
                        if (isConnectedToFocused) lineAlpha = 0.18;
                        if (focusedNode && !isConnectedToFocused) lineAlpha *= 0.25;

                        ctx.strokeStyle = (isConnectedToHover || isConnectedToFocused) ? 'rgba(255, 255, 255, 0.3)' : `rgba(255, 255, 255, ${lineAlpha})`;
                        ctx.beginPath();
                        ctx.moveTo(sx1, sy1);
                        ctx.lineTo(sx2, sy2);
                        ctx.stroke();
                    }
                }
            }

            // 控制面板定位
            if (focusedNode) {
                const panel = document.getElementById('controlPanel');
                const panelWidth = 540;
                const gap = focusedNode.panelOffsetX !== undefined ? focusedNode.panelOffsetX : 35;
                const verticalOffset = focusedNode.panelOffsetY !== undefined ? focusedNode.panelOffsetY : 0;
                const panelHeight = panel.scrollHeight || panel.offsetHeight || 460;

                let nodeScreenX = (focusedNode.worldX - camera.x) * camera.zoom + width / 2;
                let nodeScreenY = (focusedNode.worldY - camera.y) * camera.zoom + height / 2;

                let targetLeft = nodeScreenX + gap;
                let panelIsOnRight = true;
                if (targetLeft + panelWidth > width - 30) {
                    targetLeft = nodeScreenX - panelWidth - gap;
                    panelIsOnRight = false;
                }
                if (targetLeft < 30) {
                    targetLeft = 30;
                }
                activePanelIsOnRight = panelIsOnRight;

                let targetTop = nodeScreenY - panelHeight / 2 + verticalOffset;
                const minTop = 30;
                const maxTop = height - panelHeight - 30;
                if (targetTop > maxTop) targetTop = maxTop;
                if (targetTop < minTop) targetTop = minTop;
                if (panelHeight > height - 60) targetTop = minTop;

                panel.style.left = targetLeft + 'px';
                panel.style.top = targetTop + 'px';

                if (camera.zoom > 2.45 && panel.classList.contains('opacity-0')) {
                    panel.classList.remove('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-3');
                }
            } else {
                const panel = document.getElementById('controlPanel');
                if (!panel.classList.contains('opacity-0')) {
                    panel.classList.add('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-3');
                }
            }

            // 渲染节点
            nodes.forEach(node => {
                if (!node.isCore && !focusedNode) {
                    node.worldX += node.vx;
                    node.worldY += node.vy;
                    if (node.worldX < -width * 0.45 || node.worldX > width * 0.45) node.vx *= -1;
                    if (node.worldY < -height * 0.45 || node.worldY > height * 0.45) node.vy *= -1;
                }

                let sx = (node.worldX - camera.x) * camera.zoom + width / 2;
                let sy = (node.worldY - camera.y) * camera.zoom + height / 2;

                node.breathPhase += node.breathSpeed;
                let pulse = Math.sin(node.breathPhase);

                let currentRadius = (node.radius + pulse * (node.isCore ? 1.8 : 0.8)) * camera.zoom;
                let alpha = node.baseAlpha;
                let isHovered = (node === mouse.hoverNode);

                if (focusedNode && node !== focusedNode) {
                    alpha = 0.28;
                } else if (node === focusedNode || isHovered) {
                    alpha = 1.0;
                }

                // 核心节点特效
                if (node.isCore) {
                    ctx.save();
                    ctx.translate(sx, sy);
                    let screenSize = Math.min(width, height);
                    let fieldScale = node.fieldScale || 1;
                    fieldScale = Math.max(0.4, Math.min(fieldScale, 3.5));
                    let maxCoreField = (screenSize * 0.45) * camera.zoom * fieldScale;

                    for (let i = 0; i < 4; i++) {
                        let waveRadius = (45 * camera.zoom) + ((radarWavePhase * 18 + i * 110) % (maxCoreField - 45 * camera.zoom));
                        let waveAlpha = Math.max(0, (1 - waveRadius / maxCoreField) * 0.22);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${waveAlpha})`;
                        ctx.lineWidth = 1.6;
                        ctx.beginPath();
                        ctx.arc(0, 0, waveRadius, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    ctx.save();
                    ctx.rotate(rotationAngle);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 12;
                    ctx.setLineDash([2, 22]);
                    ctx.beginPath();
                    ctx.arc(0, 0, maxCoreField * 0.65, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.rotate(rotationAngle * 0.6);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.lineWidth = 1;
                    const tickCount = 16;
                    const tickRadius = maxCoreField * 0.52;
                    for (let i = 0; i < tickCount; i++) {
                        let angle = (i / tickCount) * Math.PI * 2;
                        let x1 = Math.cos(angle) * (tickRadius - 46);
                        let y1 = Math.sin(angle) * (tickRadius - 46);
                        let x2 = Math.cos(angle) * tickRadius;
                        let y2 = Math.sin(angle) * tickRadius;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                    }
                    ctx.restore();
                    ctx.restore();

                    let coreGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, maxCoreField);
                    coreGlow.addColorStop(0, `rgba(255, 255, 255, ${0.18 + pulse * 0.08})`);
                    coreGlow.addColorStop(0.35, `rgba(255, 255, 255, ${0.06 + pulse * 0.02})`);
                    coreGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = coreGlow;
                    ctx.beginPath();
                    ctx.arc(sx, sy, maxCoreField, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 聚焦节点特效
                if (node === focusedNode) {
                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(rotationAngle);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 6]);
                    ctx.beginPath();
                    ctx.arc(0, 0, 36 * camera.zoom, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();

                    let targetGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 120 * camera.zoom);
                    targetGlow.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
                    targetGlow.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
                    targetGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = targetGlow;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 120 * camera.zoom, 0, Math.PI * 2);
                    ctx.fill();
                } else if (!node.isCore) {
                    const baseGlow = (node.radius || 12) * 1.6;
                    let glowRadius = isHovered ? Math.max(45, baseGlow * 1.8) * camera.zoom : (baseGlow + pulse * 4) * camera.zoom;
                    let glowAlpha = isHovered ? 0.15 : 0.04 + pulse * 0.015;
                    let glowGradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowRadius);
                    glowGradient.addColorStop(0, `rgba(255, 255, 255, ${glowAlpha})`);
                    glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = glowGradient;
                    ctx.beginPath();
                    ctx.arc(sx, sy, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 节点圆点
                const strokeColor = node === focusedNode ? '#ffffff' : `rgba(230, 230, 240, ${alpha})`;
                const lineWidth = node === focusedNode ? 2 : 4;
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = lineWidth;
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(3, currentRadius), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.05})`;
                ctx.fill();
                ctx.stroke();

                // 节点标签
                if (node.isCore) {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.font = '600 14px Inter, sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
                    const coreLabelGap = Math.max(44 * camera.zoom, node.radius + 26 * camera.zoom);
                    ctx.fillText(node.name, sx, sy - coreLabelGap);
                    ctx.textBaseline = 'top';
                    ctx.font = '500 11px JetBrains Mono, monospace';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                    ctx.fillText('ROOT // 192.168.1.1', sx, sy + (coreLabelGap - 2 * camera.zoom));
                } else {
                    let textAlpha = alpha;
                    if (isHovered && node !== focusedNode) textAlpha = 1.0;
                    ctx.font = (node === focusedNode || isHovered) ? '500 13px Inter, sans-serif' : '300 12px Inter, sans-serif';
                    ctx.fillStyle = (node === focusedNode || isHovered) ? 'rgba(255, 255, 255, 0.95)' : `rgba(255, 255, 255, ${textAlpha * 0.8})`;
                    ctx.textBaseline = 'middle';
                    const labelGap = Math.max(22, currentRadius + 12 * camera.zoom);
                    if (node === focusedNode) {
                        if (activePanelIsOnRight) {
                            ctx.textAlign = 'right';
                            ctx.fillText(node.name, sx - labelGap, sy);
                        } else {
                            ctx.textAlign = 'left';
                            ctx.fillText(node.name, sx + labelGap, sy);
                        }
                    } else {
                        ctx.textAlign = 'left';
                        ctx.fillText(node.name, sx + labelGap, sy);
                    }
                }
                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            });

            requestAnimationFrame(animate);
        }

        async function init() {
            await loadDevices();
            requestAnimationFrame(animate);
            connectWebSocket();
        }

        init();
    </script>
</body>
