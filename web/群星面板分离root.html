<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Nexus // ESP Device Universe Platform - Bluebox Chamil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            color-scheme: dark;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #030305 !important;
            color: #ededed !important;
            overflow: hidden;
            user-select: none;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-panel {
            background: rgba(12, 12, 18, 0.85);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        #controlPanel {
            background: rgba(22, 22, 24, 0.94);
            backdrop-filter: blur(36px);
            -webkit-backdrop-filter: blur(36px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 24px 54px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .corner-marker {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: rgba(255, 255, 255, 0.12);
            pointer-events: none;
        }

        .corner-tl {
            top: 28px;
            left: 28px;
            border-top: 1px solid;
            border-left: 1px solid;
        }

        .corner-tr {
            top: 28px;
            right: 28px;
            border-top: 1px solid;
            border-right: 1px solid;
        }

        .corner-bl {
            bottom: 28px;
            left: 28px;
            border-bottom: 1px solid;
            border-left: 1px solid;
        }

        .corner-br {
            bottom: 28px;
            right: 28px;
            border-bottom: 1px solid;
            border-right: 1px solid;
        }
    </style>
</head>

<body class="w-screen h-screen relative flex items-center justify-between">

    <!-- 四角工程定位符 -->
    <div class="corner-marker corner-tl"></div>
    <div class="corner-marker corner-tr"></div>
    <div class="corner-marker corner-bl"></div>
    <div class="corner-marker corner-br"></div>

    <!-- 顶部状态栏 -->
    <header class="absolute top-8 left-12 z-10 flex items-center space-x-4 pointer-events-auto cursor-pointer group"
        ondblclick="toggleFullScreen()" title="双击此处切换浏览器全屏/窗口模式">
        <div class="flex items-center space-x-2">
            <div class="w-1.5 h-1.5 rounded-full bg-white animate-pulse group-hover:scale-150 transition-transform">
            </div>
            <span
                class="text-xs uppercase tracking-widest text-zinc-300 mono group-hover:text-white transition-colors">BLUEBOX
                CHAMIL // MASTER CORE [双击全屏]</span>
        </div>
        <span class="text-zinc-700">/</span>
        <span class="text-xs text-zinc-500 mono" id="system-status">NODES ONLINE</span>
    </header>

    <!-- 初始中央状态指引胶囊 -->
    <div id="initialHintPill"
        class="absolute top-10 left-1/2 -translate-x-1/2 z-10 pointer-events-none transition-all duration-500">
        <div
            class="px-4 py-1.5 rounded-full bg-white/[0.03] border border-white/10 backdrop-blur-md flex items-center space-x-3 text-xs text-zinc-400 mono shadow-2xl">
            <span class="w-1.5 h-1.5 rounded-full bg-zinc-300 animate-ping"></span>
            <span>SPACE UNIVERSE READY · SELECT NODE TO INSPECT</span>
        </div>
    </div>

    <!-- 右上角：实时系统遥测参数 -->
    <div
        class="absolute top-8 right-12 z-10 hidden md:flex items-center space-x-6 text-xs mono text-zinc-500 pointer-events-none">
        <div>ARCH: <span class="text-zinc-300">CENTRALIZED</span></div>
        <div>BUS: <span class="text-zinc-300">12ms</span></div>
        <div id="liveClock" class="text-zinc-400">00:00:00</div>
    </div>

    <!-- 左下角：微型拓扑状态统计卡片 -->
    <div
        class="absolute bottom-16 left-12 z-10 pointer-events-none hidden lg:flex items-center space-x-3 px-3.5 py-2 rounded-xl glass-panel text-[11px] mono text-zinc-400 shadow-xl">
        <span class="text-zinc-200 font-medium tracking-wider">TOPOLOGY:</span>
        <span class="text-zinc-400">CORE: <strong class="text-zinc-200">1</strong></span>
        <span class="text-zinc-700">/</span>
        <span class="text-zinc-400">NODES: <strong class="text-zinc-200" id="nodeCount">0</strong></span>
    </div>

    <!-- 底部操作提示 -->
    <footer class="absolute bottom-8 left-12 z-10 pointer-events-none flex items-center space-x-6">
        <p class="text-sm text-zinc-500 tracking-wider">点击任意设备节点以聚焦控制面板 · 双击左上角标题切换全屏</p>
        <span class="text-zinc-800">|</span>
        <span class="text-xs text-zinc-600 mono">SYS.GRID // v2.6.2</span>
    </footer>

    <!-- 主画布 -->
    <main class="w-full h-full relative cursor-grab active:cursor-grabbing" id="canvas-container">
        <canvas id="universeCanvas" class="block w-full h-full"></canvas>
    </main>

    <!-- 动态控制面板 -->
    <aside id="controlPanel"
        class="absolute w-[440px] rounded-2xl z-30 flex flex-col justify-between opacity-0 pointer-events-none scale-95 translate-y-3 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] shadow-2xl">
        <div class="p-6 border-b border-white/10 flex items-start justify-between">
            <div>
                <div class="flex items-center space-x-2 mb-2">
                    <span id="panelDeviceType"
                        class="text-xs uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-white/5 text-zinc-300 mono border border-white/10">TYPE</span>
                    <span id="panelDeviceStatus"
                        class="text-xs uppercase tracking-wider text-emerald-400 mono flex items-center font-medium">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2 animate-pulse"></span> ONLINE
                    </span>
                </div>
                <h2 id="panelDeviceName" class="text-2xl font-semibold tracking-tight text-white mt-1">Device Name</h2>
            </div>
            <button onclick="closePanel()"
                class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </button>
        </div>

        <!-- 面板内容区域：这里会被动态加载的内容替换 -->
        <div id="panelContentArea" class="p-6 max-h-[60vh] overflow-y-auto no-scrollbar space-y-7">
            <!-- 默认加载中状态，实际会被子设备HTML替换 -->
            <div class="text-center text-zinc-500 py-10 text-sm mono">加载中...</div>
        </div>

        <div class="p-5 border-t border-white/10 flex items-center justify-between bg-black/20">
            <button
                class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-zinc-300 transition-colors mono">重启设备</button>
            <button onclick="closePanel()"
                class="px-5 py-2 rounded-lg bg-white text-black hover:bg-zinc-200 text-sm font-medium transition-colors">确认关闭</button>
        </div>
    </aside>

    <script>
        // ========== 全屏切换 ==========
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.error(`全屏切换失败: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        // ========== 时钟更新 ==========
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // ========== Canvas 初始化 ==========
        const canvas = document.getElementById('universeCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // ========== 核心节点（硬编码在 index.html 中） ==========
        const coreNode = {
            id: 'BLUEBOX-CORE',
            name: 'BLUEBOX CHAMIL',
            type: 'Master Core',
            address: '192.168.1.1',
            rssi: '0 dBm',
            x: 0.50,
            y: 0.50,
            radius: 10,
            baseAlpha: 1.0,
            isCore: true,
            worldX: 0,
            worldY: 0,
            vx: 0,
            vy: 0,
            breathPhase: Math.random() * Math.PI * 2,
            breathSpeed: 0.012,
            panelFile: null,  // 核心节点面板在 index.html 中处理
            status: 'online'
        };

        // ========== 动态设备节点数组 ==========
        let externalDevices = [];  // 存储从 devices/ 加载的设备配置
        let nodes = [coreNode];   // 所有节点（核心 + 外部设备）

        // ========== 环境粒子 ==========
        const ambientParticles = Array.from({ length: 30 }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.08,
            vy: (Math.random() - 0.5) * 0.08,
            radius: 1.0 + Math.random() * 1.5,
            alpha: 0.1 + Math.random() * 0.2
        }));

        let focusedNode = null;
        let activePanelIsOnRight = true;
        let mouse = { x: -1000, y: -1000, hoverNode: null };

        let camera = {
            x: 0,
            y: 0,
            zoom: 1.0,
            targetX: 0,
            targetY: 0,
            targetZoom: 1.0
        };

        // ========== 面板内容缓存 ==========
        const panelContentCache = {};

        // ========== 从 devices/ 加载设备配置 ==========
        // ========== 从 devices/ 加载设备配置 ==========
        async function loadExternalDevices() {
            try {
                const response = await fetch('devices.json');
                const devicePaths = await response.json();

                const totalDevices = devicePaths.length;

                // 预生成不重叠的坐标池（基于原始代码的分布模式）
                const angleStep = (Math.PI * 2) / totalDevices;
                const radiusMin = 0.18;
                const radiusMax = 0.38;

                const loadPromises = devicePaths.map(async (path, index) => {
                    try {
                        const htmlResponse = await fetch(path);
                        const htmlContent = await htmlResponse.text();

                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlContent, 'text/html');
                        const configScript = doc.querySelector('script[type="application/json"].device-config');

                        if (!configScript) {
                            console.warn(`设备文件 ${path} 中未找到设备配置，跳过`);
                            return null;
                        }

                        const deviceConfig = JSON.parse(configScript.textContent);

                        // 如果设备配置中没有坐标，自动生成
                        if (deviceConfig.x === undefined || deviceConfig.y === undefined) {
                            const angle = index * angleStep + (Math.random() - 0.5) * 0.4;
                            const radius = radiusMin + Math.random() * (radiusMax - radiusMin);
                            deviceConfig.x = 0.5 + Math.cos(angle) * radius;
                            deviceConfig.y = 0.5 + Math.sin(angle) * radius;
                        }

                        // 计算世界坐标
                        deviceConfig.worldX = (deviceConfig.x - 0.5) * 1200;
                        deviceConfig.worldY = (deviceConfig.y - 0.5) * 800;
                        deviceConfig.vx = (Math.random() - 0.5) * 0.15;
                        deviceConfig.vy = (Math.random() - 0.5) * 0.15;
                        deviceConfig.breathPhase = Math.random() * Math.PI * 2;
                        deviceConfig.breathSpeed = 0.012 + Math.random() * 0.015;
                        deviceConfig.panelFile = path;
                        deviceConfig.isCore = false;

                        // 缓存面板 HTML 内容
                        const panelContent = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, '');
                        panelContentCache[path] = panelContent;

                        return deviceConfig;
                    } catch (err) {
                        console.error(`加载设备文件 ${path} 失败:`, err);
                        return null;
                    }
                });

                const loadedDevices = await Promise.all(loadPromises);
                externalDevices = loadedDevices.filter(d => d !== null);

                nodes = [coreNode, ...externalDevices];

                document.getElementById('nodeCount').innerText = externalDevices.length;
                document.getElementById('system-status').innerText = `${externalDevices.length + 1} NODES ONLINE`;

                console.log(`已加载 ${externalDevices.length} 个外部设备节点`);
            } catch (err) {
                console.error('加载 devices.json 失败:', err);
            }
        }
        // ========== 加载面板内容到控制面板 ==========
        function loadPanelContent(devicePath) {
            const contentArea = document.getElementById('panelContentArea');

            if (panelContentCache[devicePath]) {
                contentArea.innerHTML = panelContentCache[devicePath];
                executePanelScripts(contentArea);
                // 内容加载后重新定位面板
                requestAnimationFrame(() => repositionPanel());
            } else {
                fetch(devicePath)
                    .then(res => res.text())
                    .then(html => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(html, 'text/html');
                        const panelContent = doc.body.innerHTML.replace(/<script[\s\S]*?<\/script>/g, '');
                        panelContentCache[devicePath] = panelContent;
                        contentArea.innerHTML = panelContent;
                        executePanelScripts(contentArea);
                        // 内容加载后重新定位面板
                        requestAnimationFrame(() => repositionPanel());
                    })
                    .catch(err => {
                        contentArea.innerHTML = `<div class="text-center text-zinc-500 py-10 text-sm mono">加载失败: ${err.message}</div>`;
                        requestAnimationFrame(() => repositionPanel());
                    });
            }
        }

        // ========== 执行面板内的脚本 ==========
        function executePanelScripts(container) {
            const scripts = container.querySelectorAll('script');
            scripts.forEach(script => {
                const newScript = document.createElement('script');
                if (script.src) {
                    newScript.src = script.src;
                } else {
                    newScript.textContent = script.textContent;
                }
                script.parentNode.replaceChild(newScript, script);
            });
        }

        // ========== 显示核心节点面板 ==========
        function showCorePanel() {
            const contentArea = document.getElementById('panelContentArea');
            contentArea.innerHTML = `
                <div class="space-y-3">
                    <h3 class="text-xs uppercase tracking-widest text-zinc-400 mono font-medium">硬件参数与地址</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-3.5 rounded-xl bg-white/[0.03] border border-white/5">
                            <span class="block text-xs text-zinc-500 mb-1.5">物理地址 (MAC/IP)</span>
                            <span class="text-sm font-medium text-zinc-200 mono">192.168.1.1</span>
                        </div>
                        <div class="p-3.5 rounded-xl bg-white/[0.03] border border-white/5">
                            <span class="block text-xs text-zinc-500 mb-1.5">信号强度 (RSSI)</span>
                            <span class="text-sm font-medium text-zinc-200 mono">0 dBm</span>
                        </div>
                    </div>
                </div>
                <div class="space-y-3">
                    <h3 class="text-xs uppercase tracking-widest text-zinc-400 mono font-medium">控制中心</h3>
                    <div class="p-5 rounded-xl bg-white/[0.03] border border-white/5 space-y-4">
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-zinc-300">核心运行状态</span>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" checked class="sr-only peer" id="corePowerToggle">
                                <div class="w-10 h-5 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-white peer-checked:text-black"></div>
                            </label>
                        </div>
                        <div class="space-y-2 pt-3 border-t border-white/8">
                            <div class="flex justify-between text-xs text-zinc-400">
                                <span>PWM 输出功率</span>
                                <span class="mono text-zinc-200 font-medium" id="sliderVal">85%</span>
                            </div>
                            <input type="range" min="0" max="100" value="85" class="w-full accent-white bg-white/15 rounded-lg appearance-none h-1.5 cursor-pointer" oninput="document.getElementById('sliderVal').innerText = this.value + '%'">
                        </div>
                    </div>
                </div>
                <div class="space-y-3">
                    <h3 class="text-xs uppercase tracking-widest text-zinc-400 mono font-medium">遥测日志流</h3>
                    <div class="p-4 rounded-xl bg-black/60 border border-white/5 font-mono text-xs text-zinc-400 space-y-2">
                        <p class="text-emerald-400/95">[SYSTEM] 核心节点连接稳定，握手成功。</p>
                        <p class="text-zinc-500">[TELEMETRY] 核心温度: 38.4°C / 负载: 4.2%</p>
                        <p class="text-zinc-500">[PACKET] 收到来自总线的状态同步帧。</p>
                    </div>
                </div>
            `;
            // 内容加载后重新定位面板
            requestAnimationFrame(() => repositionPanel());
        }

        // ========== 鼠标交互 ==========
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;

            if (focusedNode) return;

            let worldMouseX = (mouse.x - width / 2) / camera.zoom + camera.x;
            let worldMouseY = (mouse.y - height / 2) / camera.zoom + camera.y;

            let found = null;
            for (let node of nodes) {
                let dx = node.worldX - worldMouseX;
                let dy = node.worldY - worldMouseY;
                let hitRadius = node.isCore ? 120 : 35;
                if (Math.sqrt(dx * dx + dy * dy) < hitRadius) {
                    found = node;
                    break;
                }
            }
            mouse.hoverNode = found;
            canvas.style.cursor = found ? 'pointer' : 'grab';
        });

        canvas.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
            mouse.hoverNode = null;
        });

        canvas.addEventListener('click', () => {
            if (mouse.hoverNode && !focusedNode) {
                selectNode(mouse.hoverNode);
            }
        });

        // ========== 选择节点 ==========
        function selectNode(node) {
            focusedNode = node;
            camera.targetZoom = 2.6;
            camera.targetX = node.worldX + (width * 0.15) / 2.6;
            camera.targetY = node.worldY;

            const hintPill = document.getElementById('initialHintPill');
            hintPill.style.opacity = '0';
            hintPill.style.transform = 'translate(-50%, -20px)';

            document.getElementById('panelDeviceName').innerText = node.name;
            document.getElementById('panelDeviceType').innerText = node.type;

            // 动态设置在线/离线状态
            updatePanelStatus(node.status || 'online');

            // 根据节点类型加载对应的面板内容
            if (node.isCore) {
                showCorePanel();
            } else if (node.panelFile) {
                loadPanelContent(node.panelFile);
            }
        }

        // ========== 更新面板状态显示 ==========
        function updatePanelStatus(status) {
            const statusEl = document.getElementById('panelDeviceStatus');
            const indicatorDot = statusEl.querySelector('span');

            if (status === 'online') {
                statusEl.className = 'text-xs uppercase tracking-wider text-emerald-400 mono flex items-center font-medium';
                if (indicatorDot) {
                    indicatorDot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2 animate-pulse';
                }
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2 animate-pulse"></span> ONLINE';
            } else if (status === 'offline') {
                statusEl.className = 'text-xs uppercase tracking-wider text-red-400 mono flex items-center font-medium';
                if (indicatorDot) {
                    indicatorDot.className = 'w-1.5 h-1.5 rounded-full bg-red-400 mr-2';
                }
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-red-400 mr-2"></span> OFFLINE';
            } else {
                // 其他状态（如 maintenance、error 等）
                statusEl.className = 'text-xs uppercase tracking-wider text-yellow-400 mono flex items-center font-medium';
                statusEl.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-yellow-400 mr-2 animate-pulse"></span> ' + status.toUpperCase();
            }
        }

        // ========== 关闭面板 ==========
        function closePanel() {
            if (!focusedNode) return;
            const panel = document.getElementById('controlPanel');
            panel.classList.add('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-3');

            const hintPill = document.getElementById('initialHintPill');
            hintPill.style.opacity = '1';
            hintPill.style.transform = 'translate(-50%, 0)';

            camera.targetZoom = 1.0;
            camera.targetX = 0;
            camera.targetY = 0;

            focusedNode = null;
        }

        // ========== 全局辅助函数（供子设备面板调用） ==========
        function handleDeviceToggle(checkbox, deviceId) {
            console.log(`设备 ${deviceId} 状态切换: ${checkbox.checked ? '开启' : '关闭'}`);
        }

        function toggleRelayChannel(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerText = el.innerText === '关闭' ? '开启' : '关闭';
            }
        }

        function toggleUSBPort(elementId) {
            const el = document.getElementById(elementId);
            if (el) {
                el.innerText = el.innerText === '开启' ? '关闭' : '开启';
            }
        }

        // ========== 动画循环 ==========
        let rotationAngle = 0;
        let radarWavePhase = 0;

        function animate() {
            ctx.clearRect(0, 0, width, height);
            rotationAngle += 0.003;
            radarWavePhase += 0.025;

            camera.x += (camera.targetX - camera.x) * 0.08;
            camera.y += (camera.targetY - camera.y) * 0.08;
            camera.zoom += (camera.targetZoom - camera.zoom) * 0.08;

            // 背景渐变
            let bgGlow = ctx.createRadialGradient(width * 0.5, height * 0.5, 50, width * 0.5, height * 0.5, width * 0.7);
            bgGlow.addColorStop(0, 'rgba(25, 25, 38, 0.22)');
            bgGlow.addColorStop(1, 'rgba(3, 3, 5, 0)');
            ctx.fillStyle = bgGlow;
            ctx.fillRect(0, 0, width, height);

            // 网格点
            ctx.fillStyle = 'rgba(255, 255, 255, 0.018)';
            const gridSize = 64;
            for (let x = 32; x < width; x += gridSize) {
                for (let y = 32; y < height; y += gridSize) {
                    ctx.fillRect(x, y, 1, 1);
                }
            }

            // 环境粒子
            ambientParticles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > width) p.vx *= -1;
                if (p.y < 0 || p.y > height) p.vy *= -1;

                ctx.fillStyle = `rgba(255, 255, 255, ${focusedNode ? p.alpha * 0.25 : p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // 节点间连线
            ctx.lineWidth = 0.5;
            for (let i = 0; i < nodes.length; i++) {
                for (let j = i + 1; j < nodes.length; j++) {
                    let dx = nodes[i].worldX - nodes[j].worldX;
                    let dy = nodes[i].worldY - nodes[j].worldY;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 450) {
                        let sx1 = (nodes[i].worldX - camera.x) * camera.zoom + width / 2;
                        let sy1 = (nodes[i].worldY - camera.y) * camera.zoom + height / 2;
                        let sx2 = (nodes[j].worldX - camera.x) * camera.zoom + width / 2;
                        let sy2 = (nodes[j].worldY - camera.y) * camera.zoom + height / 2;

                        let isConnectedToHover = (nodes[i] === mouse.hoverNode || nodes[j] === mouse.hoverNode);
                        let isConnectedToFocused = focusedNode && (nodes[i] === focusedNode || nodes[j] === focusedNode);

                        let lineAlpha = 0.04 * (1 - dist / 450);
                        if (nodes[i].isCore || nodes[j].isCore) lineAlpha *= 2.2;
                        if (isConnectedToHover) lineAlpha = 0.3;
                        if (isConnectedToFocused) lineAlpha = 0.18;
                        if (focusedNode && !isConnectedToFocused) lineAlpha *= 0.25;

                        ctx.strokeStyle = (isConnectedToHover || isConnectedToFocused) ? 'rgba(255, 255, 255, 0.3)' : `rgba(255, 255, 255, ${lineAlpha})`;
                        ctx.beginPath();
                        ctx.moveTo(sx1, sy1);
                        ctx.lineTo(sx2, sy2);
                        ctx.stroke();
                    }
                }
            }

            // 控制面板定位
            // 控制面板定位
            if (focusedNode) {
                const panel = document.getElementById('controlPanel');
                const panelWidth = 440;
                const gap = 35;

                // 动态获取面板实际高度（包括所有内容）
                const panelHeight = panel.scrollHeight || panel.offsetHeight || 460;

                let nodeScreenX = (focusedNode.worldX - camera.x) * camera.zoom + width / 2;
                let nodeScreenY = (focusedNode.worldY - camera.y) * camera.zoom + height / 2;

                // 水平方向：优先放在节点右侧，如果超出则放左侧
                let targetLeft = nodeScreenX + gap;
                let panelIsOnRight = true;

                if (targetLeft + panelWidth > width - 30) {
                    targetLeft = nodeScreenX - panelWidth - gap;
                    panelIsOnRight = false;
                }
                // 确保左边也不超出
                if (targetLeft < 30) {
                    targetLeft = 30;
                }
                activePanelIsOnRight = panelIsOnRight;

                // 垂直方向：优先以节点为中心，超出时智能调整
                let targetTop = nodeScreenY - panelHeight / 2;
                const minTop = 30;
                const maxTop = height - panelHeight - 30;

                // 如果底部超出，向上移动
                if (targetTop > maxTop) {
                    targetTop = maxTop;
                }
                // 如果顶部超出，向下移动
                if (targetTop < minTop) {
                    targetTop = minTop;
                }
                // 如果面板太高、超出屏幕，顶部对齐顶部
                if (panelHeight > height - 60) {
                    targetTop = minTop;
                }

                panel.style.left = targetLeft + 'px';
                panel.style.top = targetTop + 'px';

                if (camera.zoom > 2.45 && panel.classList.contains('opacity-0')) {
                    panel.classList.remove('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-3');
                }
            } else {
                const panel = document.getElementById('controlPanel');
                if (!panel.classList.contains('opacity-0')) {
                    panel.classList.add('opacity-0', 'pointer-events-none', 'scale-95', 'translate-y-3');
                }
            }

            // 渲染节点
            nodes.forEach(node => {
                if (!node.isCore && !focusedNode) {
                    node.worldX += node.vx;
                    node.worldY += node.vy;
                    if (node.worldX < -width * 0.45 || node.worldX > width * 0.45) node.vx *= -1;
                    if (node.worldY < -height * 0.45 || node.worldY > height * 0.45) node.vy *= -1;
                }

                let sx = (node.worldX - camera.x) * camera.zoom + width / 2;
                let sy = (node.worldY - camera.y) * camera.zoom + height / 2;

                node.breathPhase += node.breathSpeed;
                let pulse = Math.sin(node.breathPhase);

                let currentRadius = (node.radius + pulse * (node.isCore ? 1.8 : 0.8)) * camera.zoom;

                let alpha = node.baseAlpha;
                let isHovered = (node === mouse.hoverNode);

                if (focusedNode && node !== focusedNode) {
                    alpha = 0.28;
                } else if (node === focusedNode || isHovered) {
                    alpha = 1.0;
                }

                // 核心节点特效
                if (node.isCore) {
                    ctx.save();
                    ctx.translate(sx, sy);

                    let screenSize = Math.min(width, height);
                    let maxCoreField = (screenSize * 0.45) * camera.zoom;

                    for (let i = 0; i < 4; i++) {
                        let waveRadius = (45 * camera.zoom) + ((radarWavePhase * 18 + i * 110) % (maxCoreField - 45 * camera.zoom));
                        let waveAlpha = Math.max(0, (1 - waveRadius / maxCoreField) * 0.22);
                        ctx.strokeStyle = `rgba(255, 255, 255, ${waveAlpha})`;
                        ctx.lineWidth = 0.8;
                        ctx.beginPath();
                        ctx.arc(0, 0, waveRadius, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    ctx.save();
                    ctx.rotate(rotationAngle);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([8, 12]);
                    ctx.beginPath();
                    ctx.arc(0, 0, maxCoreField * 0.65, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();

                    ctx.save();
                    ctx.rotate(rotationAngle * 0.6);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.lineWidth = 1;
                    const tickCount = 16;
                    const tickRadius = maxCoreField * 0.52;
                    for (let i = 0; i < tickCount; i++) {
                        let angle = (i / tickCount) * Math.PI * 2;
                        let x1 = Math.cos(angle) * (tickRadius - 6);
                        let y1 = Math.sin(angle) * (tickRadius - 6);
                        let x2 = Math.cos(angle) * tickRadius;
                        let y2 = Math.sin(angle) * tickRadius;
                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.stroke();
                    }
                    ctx.restore();

                    ctx.restore();

                    let coreGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, maxCoreField);
                    coreGlow.addColorStop(0, `rgba(255, 255, 255, ${0.18 + pulse * 0.08})`);
                    coreGlow.addColorStop(0.35, `rgba(255, 255, 255, ${0.06 + pulse * 0.02})`);
                    coreGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = coreGlow;
                    ctx.beginPath();
                    ctx.arc(sx, sy, maxCoreField, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 聚焦节点特效
                if (node === focusedNode) {
                    ctx.save();
                    ctx.translate(sx, sy);
                    ctx.rotate(rotationAngle);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([4, 6]);
                    ctx.beginPath();
                    ctx.arc(0, 0, 36 * camera.zoom, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();

                    let targetGlow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 120 * camera.zoom);
                    targetGlow.addColorStop(0, 'rgba(255, 255, 255, 0.18)');
                    targetGlow.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
                    targetGlow.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = targetGlow;
                    ctx.beginPath();
                    ctx.arc(sx, sy, 120 * camera.zoom, 0, Math.PI * 2);
                    ctx.fill();
                } else if (!node.isCore) {
                    let glowRadius = isHovered ? 45 * camera.zoom : (22 + pulse * 4) * camera.zoom;
                    let glowAlpha = isHovered ? 0.15 : 0.04 + pulse * 0.015;

                    let glowGradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, glowRadius);
                    glowGradient.addColorStop(0, `rgba(255, 255, 255, ${glowAlpha})`);
                    glowGradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.fillStyle = glowGradient;
                    ctx.beginPath();
                    ctx.arc(sx, sy, glowRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                // 节点圆点
                ctx.fillStyle = node === focusedNode ? '#ffffff' : `rgba(230, 230, 240, ${alpha})`;
                ctx.beginPath();
                ctx.arc(sx, sy, Math.max(2, currentRadius), 0, Math.PI * 2);
                ctx.fill();

                // 节点标签
                if (node.isCore) {
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.font = '600 14px Inter, sans-serif';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.98)';
                    ctx.fillText(node.name, sx, sy - (44 * camera.zoom));

                    ctx.textBaseline = 'top';
                    ctx.font = '500 11px JetBrains Mono, monospace';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
                    ctx.fillText('ROOT // 192.168.1.1', sx, sy + (42 * camera.zoom));
                } else {
                    let textAlpha = alpha;
                    if (isHovered && node !== focusedNode) textAlpha = 1.0;

                    ctx.font = (node === focusedNode || isHovered) ? '500 13px Inter, sans-serif' : '300 12px Inter, sans-serif';
                    ctx.fillStyle = (node === focusedNode || isHovered) ? 'rgba(255, 255, 255, 0.95)' : `rgba(255, 255, 255, ${textAlpha * 0.8})`;

                    ctx.textBaseline = 'middle';
                    if (node === focusedNode) {
                        if (activePanelIsOnRight) {
                            ctx.textAlign = 'right';
                            ctx.fillText(node.name, sx - 22, sy);
                        } else {
                            ctx.textAlign = 'left';
                            ctx.fillText(node.name, sx + 22, sy);
                        }
                    } else {
                        ctx.textAlign = 'left';
                        ctx.fillText(node.name, sx + 22, sy);
                    }
                }

                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
            });

            requestAnimationFrame(animate);
        }

        // ========== 启动 ==========
        async function init() {
            await loadExternalDevices();
            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>
