<!DOCTYPE html>

    <meta charset="UTF-8">

    <!-- ===== 样式已移入 body 开头，确保被加载 ===== -->
    <style>
        /* ===== 灯光控制 UI 样式（复刻 openai_style，背景透明） ===== */
        .light-control-panel {
            --lp-text-main: #f0f0f2;
            --lp-text-muted: #d4d4d8;
            --lp-text-dim: #a1a1aa;
            --lp-card-border: rgba(255, 255, 255, 0.10);
            --lp-row-bg: rgba(255, 255, 255, 0.04);
            --lp-row-border: rgba(255, 255, 255, 0.07);
            --lp-input-bg: rgba(0, 0, 0, 0.5);
            --lp-radius-sm: 8px;

            /* 背景透明，只保留边框和阴影 */
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 1px solid var(--lp-card-border);
            border-radius: 16px;
            padding: 24px 24px 20px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--lp-text-main);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ---- toggle 行 ---- */
        .light-control-panel .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0 0;
        }

        .light-control-panel .toggle-label-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .light-control-panel .toggle-label {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--lp-text-main);
        }

        .light-control-panel .toggle-sublabel {
            font-size: 13px;
            color: var(--lp-text-dim);
            font-weight: 450;
        }

        .light-control-panel .toggle-track {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 999px;
            cursor: default;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .light-control-panel .toggle-track.checked {
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .light-control-panel .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                width 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                background-color 0.2s ease;
        }

        .light-control-panel .toggle-track.checked .toggle-thumb {
            transform: translateX(22px);
            background: #0a0a0c;
        }

        /* ---- pending 状态（转圈圈） ---- */
        .light-control-panel .toggle-track.pending {
            cursor: default;
            pointer-events: none;
            animation: togglePulse 1s ease-in-out infinite;
        }

        @keyframes togglePulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        /* ---- 灯泡 ---- */
        .light-control-panel .bulb-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 16px 0 10px;
            padding: 20px 0 8px;
        }

        .light-control-panel .bulb-glow {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: radial-gradient(circle, rgba(255, 157, 0, 0.18), transparent 55%);
            filter: blur(50px);
            pointer-events: none;
            transform: scale(0.9);
            animation: rgbGlowBreathe 6s infinite alternate;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 1;
        }

        .light-control-panel .bulb-glow.light-off {
            opacity: 0;
            animation: none;
            transform: scale(0.85);
        }

        @keyframes rgbGlowBreathe {
            0% {
                transform: scale(0.9);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        .light-control-panel .color-swatch {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ff9d00;
            box-shadow: 0 0 80px rgba(255, 157, 0, 0.5);
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(1);
            opacity: 1;
            position: relative;
            z-index: 1;
        }

        .light-control-panel .color-swatch.light-off {
            transform: scale(0.1);
            opacity: 0;
            filter: brightness(0.2);
            pointer-events: none;
        }

        .light-control-panel .color-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .light-control-panel .color-info-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--lp-text-muted);
        }

        .light-control-panel .color-info-hex {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12.5px;
            color: var(--lp-text-dim);
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ---- 控制控件（HSL RGB 模式） ---- */
        .light-control-panel .controls-wrap {
            display: block;
            margin-top: 18px;
            opacity: 1;
        }

        .light-control-panel .controls-wrap.disabled {
            opacity: 0.30;
            pointer-events: none;
        }

        .light-control-panel .controls-inner {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 6px 4px 4px 4px;
        }

        .light-control-panel .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .light-control-panel .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--lp-text-muted);
        }

        .light-control-panel .control-val {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12px;
            color: var(--lp-text-dim);
            background: rgba(255, 255, 255, 0.04);
            padding: 0 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .light-control-panel .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.2s ease;
        }

        .light-control-panel .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .light-control-panel .slider-white {
            background: rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        /* ---- 响应式微调 ---- */
        @media (max-width: 420px) {
            .light-control-panel .color-swatch {

            }

            }
        }

                height: 72px;
            }

    <!-- 日志功能脚本 -->
    <script>
        (function () {
            // ---------- 日志数据管理 ----------
            const MAX_LOG_COUNT = 50;
            let rawLogs = [];
            let currentFilter = 'ALL';

            const logEl = document.getElementById('log');
            const logCountEl = document.getElementById('logCount');
            const logPanel = document.getElementById('logPanel');
            const logHeader = document.getElementById('logHeader');

            // 默认折叠（去掉 open 类）
            logPanel.classList.remove('open');

            // ---------- 渲染日志 ----------
            function renderLogs() {
                logEl.innerHTML = '';
                const filtered = rawLogs.filter(item => currentFilter === 'ALL' || item.type === currentFilter);
                filtered.forEach(item => {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    // 时间
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'log-time';
                    timeSpan.textContent = item.time;
                    // 标签
                    const badge = document.createElement('span');
                    badge.className = 'badge badge-' + item.type;
                    badge.textContent = item.type;
                    // 内容
                    const content = document.createElement('span');
                    content.className = 'log-content';
                    let displayMsg = item.msg;
                    displayMsg = displayMsg.replace(/(\{[\s\S]*\})/g, '<span class="log-data">$1</span>');
                    content.innerHTML = displayMsg;

                    line.appendChild(timeSpan);
                    line.appendChild(badge);
                    line.appendChild(content);
                    logEl.appendChild(line);
                });
                logEl.scrollTop = logEl.scrollHeight;
                logCountEl.textContent = rawLogs.length;
            }

            // ---------- 添加日志条目 ----------
            function addLog(type, msg) {
                const now = new Date();
                const time = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
                const item = { time, type, msg };
                rawLogs.push(item);
                if (rawLogs.length > MAX_LOG_COUNT) rawLogs.shift();

                // ✅ 如果当前筛选器是 "ALL" 或与日志类型匹配，增量追加（不重建）
                if (currentFilter === 'ALL' || currentFilter === type) {
                    appendLogItem(item);
                } else {
                    // 如果筛选器激活且不匹配，重新渲染（保证筛选视图正确）
                    renderLogs();
                }

                logCountEl.textContent = rawLogs.length;
            }

            // 增量追加一条日志（不重建整个列表）
            function appendLogItem(item) {
                const line = document.createElement('div');
                line.className = 'log-line';

                const timeSpan = document.createElement('span');
                timeSpan.className = 'log-time';
                timeSpan.textContent = item.time;

                const badge = document.createElement('span');
                badge.className = 'badge badge-' + item.type;
                badge.textContent = item.type;

                const content = document.createElement('span');
                content.className = 'log-content';
                let displayMsg = item.msg;
                displayMsg = displayMsg.replace(/(\{[\s\S]*\})/g, '<span class="log-data">$1</span>');
                content.innerHTML = displayMsg;

                line.appendChild(timeSpan);
                line.appendChild(badge);
                line.appendChild(content);
                logEl.appendChild(line);

                // 如果日志数量超过最大限制，移除最旧的一条（DOM 和 rawLogs 保持同步）
                while (logEl.children.length > MAX_LOG_COUNT) {
                    logEl.removeChild(logEl.firstChild);
                }

                // 自动滚动到底部
                logEl.scrollTop = logEl.scrollHeight;
            }

            window._logPanelLog = addLog; // 供外部调用（可选）

            // ---------- 拦截 MySerAdv 赋值（记录发出） ----------
            (function setupProxy() {
                const original = window.sharedData || {};
                const handler = {
                    set(target, prop, value) {
                        if (prop === 'MySerAdv') {
                            let display = typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value);
                            addLog('SEND', display);
                            target[prop] = value;
                        } else {
                            target[prop] = value;
                        }
                        return true;
                    },
                    get(target, prop) {
                        return target[prop];
                    }
                };
                const proxy = new Proxy(original, handler);
                Object.defineProperty(window, 'sharedData', {
                    get: function () { return proxy; },
                    set: function (val) {
                        console.warn('sharedData 被重新赋值，忽略');
                    },
                    configurable: true
                });
            })();

            // ---------- 监听 MyMasAdvChanged 事件（记录收到） ----------
            const bus = window.dataBus;
            if (bus) {
                bus.addEventListener('MyMasAdvChanged', function (e) {
                    const data = e.detail.MyMasAdv;
                    if (data) {
                        let display = typeof data === 'object' ? JSON.stringify(data, null, 2) : String(data);
                        addLog('RECE', display);
                    }
                });
            } else {
                console.warn('dataBus 未找到，无法监听 MyMasAdvChanged');
            }

            // ---------- 折叠/展开 ----------
            logHeader.addEventListener('click', function (e) {
                if (e.target.closest('.btn-tool')) return;
                logPanel.classList.toggle('open');
            });

            // ---------- 筛选按钮 ----------
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function () {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderLogs();
                });
            });

            // ---------- 清空 ----------
            document.getElementById('btnClearLog').addEventListener('click', function () {
                rawLogs = [];
                renderLogs();
            });

            // ---------- 复制 ----------
            document.getElementById('btnCopyLog').addEventListener('click', async function () {
                const text = rawLogs.map(i => `[${i.time}] [${i.type}] ${i.msg}`).join('\n');
                try {
                    await navigator.clipboard.writeText(text);
                    addLog('INFO', '日志已复制到剪贴板');
                } catch (e) {
                    addLog('INFO', '复制失败: ' + e.message);
                }
            });

            // 初始日志
            // addLog('INFO', '日志系统已启动，等待通信数据...');
        })();
    </script>

    <!-- 设备专属脚本（开关转圈等待，滑块保持新值等待确认）            -->
    <!-- ============================================================ -->
    <script>
        (function () {
            const bus = window.dataBus;

            // ---------- DOM 引用 ----------
            const toggleTrack = document.getElementById('lightToggle');
            const toggleSublabel = document.getElementById('toggleSublabel');
            const dot = document.getElementById('rgbColorDot');
            const hexReadout = document.getElementById('rgbHexReadout');
            const glow = document.getElementById('bulbGlow');
            const controlsWrap = document.getElementById('controlsWrap');

            const sliderHue = document.getElementById('sliderHue');
            const sliderSat = document.getElementById('sliderSaturation');
            const sliderLight = document.getElementById('sliderLightness');
            const valHue = document.getElementById('valHue');
            const valSat = document.getElementById('valSaturation');
            const valLight = document.getElementById('valLightness');

            // ---------- 状态 ----------
            let currentState = {
                light: 1,
                mode: 2,
                h: 30,
                s: 75,
                l: 50,
                brightness: 100,
                white: 125
            };

            // 上次成功同步的状态（用于超时回退）
            let lastSyncedState = { ...currentState };

            // 开关等待标志
            let togglePending = false;
            let toggleTimer = null;

            // 滑块等待标志（超时回退）
            let sliderPending = false;
            let sliderTimer = null;
            // 保存滑块发送前的状态（用于超时回退）
            let sliderRevertState = null;

            // ---------- 工具函数 ----------
            function hslToHex(h, s, l) {
                s /= 100;
                l /= 100;
                const a = s * Math.min(l, 1 - l);
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
            }

            // ---------- UI 更新（完全基于 state） ----------
            function updateUIFromState(state) {
                const isOn = state.light === 1;
                toggleTrack.classList.toggle('checked', isOn);
                toggleTrack.setAttribute('aria-checked', String(isOn));
                toggleSublabel.textContent = isOn ? '已开启' : '已关闭';

                sliderHue.value = state.h;
                sliderSat.value = state.s;
                sliderLight.value = state.l;
                valHue.textContent = String(state.h).padStart(3, '0') + '°';
                valSat.textContent = state.s + '%';
                valLight.textContent = state.l + '%';

                const hex = hslToHex(state.h, state.s, state.l);
                hexReadout.textContent = hex;
                dot.style.backgroundColor = hex;
                dot.style.boxShadow = `0 0 80px ${hex}80`;
                glow.style.background = `radial-gradient(circle, ${hex}30, transparent 55%)`;

                dot.classList.toggle('light-off', !isOn);
                glow.classList.toggle('light-off', !isOn);
                controlsWrap.classList.toggle('disabled', !isOn);
            }

            // ---------- 发送数据 ----------
            function sendState(state) {
                if (window.sharedData) {
                    const payload = {
                        id: 1,
                        state: {
                            light: currentState.light,
                            mode: currentState.mode,
                            h: currentState.h,
                            s: currentState.s,
                            l: currentState.l,
                            brightness: currentState.brightness,
                            white: currentState.white
                        },
                    };
                    window.sharedData.MySerAdv = payload;
                    // console.log('要发送的payload', payload);
                } else {
                    console.warn('sharedData 不可用，无法发送状态');
                }
            }

            // ---------- 开关控制 ----------
            toggleTrack.addEventListener('click', function (e) {
                if (togglePending) {
                    console.log('⏳ 开关等待确认中，忽略本次点击');
                    return;
                }

                // 保存当前状态用于回退
                lastSyncedState = { ...currentState };
                const newLight = currentState.light === 1 ? 0 : 1;

                // 进入 pending（UI 不改变，只转圈）
                togglePending = true;
                this.classList.add('pending');

                currentState.light = newLight;
                sendState(currentState);

                // 超时回退
                if (toggleTimer) clearTimeout(toggleTimer);
                toggleTimer = setTimeout(() => {
                    if (togglePending) {
                        togglePending = false;
                        toggleTrack.classList.remove('pending');
                        currentState = { ...lastSyncedState };
                        updateUIFromState(currentState);
                        currentRPM.state = currentState;
                        console.warn('⏰ 开关超时，回退到之前状态');
                    }
                }, 5000);

                console.log('📤 开关指令已发送（新状态:', newLight, '），等待确认...');
            });

            // ---------- 滑块控制 ----------
            // 色相
            sliderHue.addEventListener('input', function () {
                // 乐观更新 UI 和 currentState
                currentState.h = parseInt(this.value);
                valHue.textContent = String(currentState.h).padStart(3, '0') + '°';
                const hex = hslToHex(currentState.h, currentState.s, currentState.l);
                hexReadout.textContent = hex;
                dot.style.backgroundColor = hex;
                dot.style.boxShadow = `0 0 80px ${hex}80`;
                glow.style.background = `radial-gradient(circle, ${hex}30, transparent 55%)`;
            });

            sliderHue.addEventListener('change', function () {
                // 如果已经有滑块等待，先取消旧的超时
                if (sliderPending) {
                    clearTimeout(sliderTimer);
                    sliderPending = false;
                }
                // 保存当前状态（用于超时回退）
                sliderRevertState = { ...lastSyncedState };
                // 发送当前完整状态
                sendState(currentState);
                // 标记等待
                sliderPending = true;
                sliderTimer = setTimeout(() => {
                    if (sliderPending) {
                        sliderPending = false;
                        // 回退到发送前的状态
                        currentState = { ...sliderRevertState };
                        updateUIFromState(currentState);
                        currentRPM.state = currentState;
                        console.warn('⏰ 滑块超时，回退到之前状态');
                    }
                }, 5000);
                console.log('📤 色相已发送:', currentState.h, '，等待确认...');
            });

            // 饱和度
            sliderSat.addEventListener('input', function () {
                currentState.s = parseInt(this.value);
                valSat.textContent = currentState.s + '%';
                const hex = hslToHex(currentState.h, currentState.s, currentState.l);
                hexReadout.textContent = hex;
                dot.style.backgroundColor = hex;
                dot.style.boxShadow = `0 0 80px ${hex}80`;
                glow.style.background = `radial-gradient(circle, ${hex}30, transparent 55%)`;
            });

            sliderSat.addEventListener('change', function () {
                if (sliderPending) {
                    clearTimeout(sliderTimer);
                    sliderPending = false;
                }
                sliderRevertState = { ...lastSyncedState };
                sendState(currentState);
                sliderPending = true;
                sliderTimer = setTimeout(() => {
                    if (sliderPending) {
                        sliderPending = false;
                        currentState = { ...sliderRevertState };
                        updateUIFromState(currentState);
                        currentRPM.state = currentState;
                        console.warn('⏰ 滑块超时，回退到之前状态');
                    }
                }, 5000);
                console.log('📤 饱和度已发送:', currentState.s, '，等待确认...');
            });

            // 明度
            sliderLight.addEventListener('input', function () {
                currentState.l = parseInt(this.value);
                valLight.textContent = currentState.l + '%';
                const hex = hslToHex(currentState.h, currentState.s, currentState.l);
                hexReadout.textContent = hex;
                dot.style.backgroundColor = hex;
                dot.style.boxShadow = `0 0 80px ${hex}80`;
                glow.style.background = `radial-gradient(circle, ${hex}30, transparent 55%)`;
            });

            sliderLight.addEventListener('change', function () {
                if (sliderPending) {
                    clearTimeout(sliderTimer);
                    sliderPending = false;
                }
                sliderRevertState = { ...lastSyncedState };
                sendState(currentState);
                sliderPending = true;
                sliderTimer = setTimeout(() => {
                    if (sliderPending) {
                        sliderPending = false;
                        currentState = { ...sliderRevertState };
                        updateUIFromState(currentState);
                        currentRPM.state = currentState;
                        console.warn('⏰ 滑块超时，回退到之前状态');
                    }
                }, 5000);
                console.log('📤 明度已发送:', currentState.l, '，等待确认...');
            });

            currentRPM = window.sharedData.device_info_1;
            // console.log('加载信息:', currentRPM);
            console.log('加载state信息:', currentRPM.state);
            if (Object.keys(currentRPM.state).length > 0) {
                currentState = currentRPM.state;
            }

            // ---------- 外部数据同步（MyMasAdvChanged） ----------
            if (bus) {
                bus.addEventListener('MyMasAdvChanged', function (e) {
                    const total_data = e.detail.MyMasAdv;
                    if (total_data) {
                        id = total_data.id;
                        if (id == 1) {
                            console.log('html_1收到的数据:', total_data);
                        } else {
                            console.log('get error id:', total_data);
                            return;
                        }

                    } else {
                        return;
                    }
                    const data = total_data.state;

                    console.log('data的数据:', data);

                    // 更新状态
                    if (data.light !== undefined) currentState.light = data.light;
                    if (data.h !== undefined) currentState.h = data.h;
                    if (data.s !== undefined) currentState.s = data.s;
                    if (data.l !== undefined) currentState.l = data.l;
                    if (data.mode !== undefined) currentState.mode = data.mode;

                    // 更新 UI
                    updateUIFromState(currentState);
                    currentRPM.state = currentState;


                    // 更新 lastSyncedState
                    lastSyncedState = { ...currentState };

                    // 如果开关在等待确认，解除 pending
                    if (togglePending) {
                        togglePending = false;
                        toggleTrack.classList.remove('pending');
                        if (toggleTimer) {
                            clearTimeout(toggleTimer);
                            toggleTimer = null;
                        }
                        console.log('✅ 外部确认已收到，开关 pending 解除');
                    }

                    // 如果滑块在等待确认，解除 pending
                    if (sliderPending) {
                        sliderPending = false;
                        if (sliderTimer) {
                            clearTimeout(sliderTimer);
                            sliderTimer = null;
                        }
                        console.log('✅ 外部确认已收到，滑块 pending 解除');
                    }

                    console.log('📥 外部状态已同步:', currentState);
                });
            }


            // ---------- 初始化 ----------
            if (window.sharedData && window.sharedData.latestData) {
                const init = window.sharedData.latestData;
                if (init.light !== undefined) currentState.light = init.light;
                if (init.h !== undefined) currentState.h = init.h;
                if (init.s !== undefined) currentState.s = init.s;
                if (init.l !== undefined) currentState.l = init.l;
                if (init.mode !== undefined) currentState.mode = init.mode;
                lastSyncedState = { ...currentState };
            }


            updateUIFromState(currentState);
            console.log('✅ Matrix Core 控制器已启动（开关转圈等待，滑块保持新值等待确认）');
        })();
    </script>
