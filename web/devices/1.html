<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <style>
        /* ===== 灯光控制 UI 样式（完全复制自原 index.html 内嵌样式） ===== */
        .light-control-panel {
            --lp-text-main: #f0f0f2;
            --lp-text-muted: #d4d4d8;
            --lp-text-dim: #a1a1aa;
            --lp-card-border: rgba(255, 255, 255, 0.10);
            --lp-row-bg: rgba(255, 255, 255, 0.04);
            --lp-row-border: rgba(255, 255, 255, 0.07);
            --lp-input-bg: rgba(0, 0, 0, 0.5);
            --lp-radius-sm: 8px;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 1px solid var(--lp-card-border);
            border-radius: 16px;
            padding: 24px 24px 20px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--lp-text-main);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .light-control-panel .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0 0;
        }

        .light-control-panel .toggle-label-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .light-control-panel .toggle-label {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--lp-text-main);
        }

        .light-control-panel .toggle-sublabel {
            font-size: 13px;
            color: var(--lp-text-dim);
            font-weight: 450;
        }

        .light-control-panel .toggle-track {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 999px;
            cursor: default;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .light-control-panel .toggle-track.checked {
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .light-control-panel .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                width 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                background-color 0.2s ease;
        }

        .light-control-panel .toggle-track.checked .toggle-thumb {
            transform: translateX(22px);
            background: #0a0a0c;
        }

        .light-control-panel .toggle-track.pending {
            cursor: default;
            pointer-events: none;
            animation: togglePulse 1s ease-in-out infinite;
        }

        @keyframes togglePulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .light-control-panel .segment {
            position: relative;
            height: 42px;
            padding: 3px;
            display: flex;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            overflow: hidden;
        }

        /* ===== 工作模式卡片（完全复制 light-control-panel 样式） ===== */
        .mode-card {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 16px;
            padding: 24px 24px 20px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            margin-bottom: 16px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #f0f0f2;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .mode-card .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0 0;
            margin-bottom: 12px;
        }

        .mode-card .toggle-label-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .mode-card .toggle-label {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #f0f0f2;
        }

        .mode-card .segment {
            position: relative;
            height: 42px;
            padding: 3px;
            display: flex;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 13px;
            overflow: hidden;
        }

        .mode-card .segment .slider-indicator {
            position: absolute;
            top: 3px;
            left: 3px;
            height: 34px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.14);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.08);
            transition: left 0.15s cubic-bezier(0.22, 1, 0.36, 1), width 0.15s cubic-bezier(0.22, 1, 0.36, 1);
            /* width 和 left 由 JS 动态设置 */
        }

        .mode-card .segment .mode-item {
            flex: 1;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            color: #8b8f99;
            cursor: pointer;
            user-select: none;
            transition: color 0.12s ease;
            font-weight: 500;
        }

        .mode-card .segment .mode-item.active {
            color: #fff;
        }

        .light-control-panel .segment .mode-item {
            flex: 1;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            color: #8b8f99;
            cursor: pointer;
            user-select: none;
            transition: color 0.12s ease;
            font-weight: 500;
        }

        .light-control-panel .segment .mode-item.active {
            color: #fff;
        }

        /* ===== 灯泡等原有样式 ===== */
        .light-control-panel .bulb-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 16px 0 10px;
            padding: 20px 0 8px;
        }

        .light-control-panel .bulb-glow {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: radial-gradient(circle, rgba(255, 157, 0, 0.18), transparent 55%);
            filter: blur(50px);
            pointer-events: none;
            transform: scale(0.9);
            animation: rgbGlowBreathe 6s infinite alternate;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 1;
        }

        .light-control-panel .bulb-glow.light-off {
            opacity: 0;
            animation: none;
            transform: scale(0.85);
        }

        @keyframes rgbGlowBreathe {
            0% {
                transform: scale(0.9);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        .light-control-panel .color-swatch {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ff9d00;
            box-shadow: 0 0 80px rgba(255, 157, 0, 0.5);
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(1);
            opacity: 1;
            position: relative;
            z-index: 1;
        }

        .light-control-panel .color-swatch.light-off {
            transform: scale(0.1);
            opacity: 0;
            filter: brightness(0.2);
            pointer-events: none;
        }

        .light-control-panel .color-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .light-control-panel .color-info-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--lp-text-muted);
        }

        .light-control-panel .color-info-hex {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12.5px;
            color: var(--lp-text-dim);
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .light-control-panel .controls-wrap {
            display: block;
            margin-top: 18px;
            opacity: 1;
        }

        .light-control-panel .controls-wrap.disabled {
            opacity: 0.30;
            pointer-events: none;
        }

        .light-control-panel .controls-inner {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 6px 4px 4px 4px;
        }

        .light-control-panel .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .light-control-panel .control-item.hidden {
            display: none !important;
        }

        .light-control-panel .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--lp-text-muted);
        }

        .light-control-panel .control-val {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12px;
            color: var(--lp-text-dim);
            background: rgba(255, 255, 255, 0.04);
            padding: 0 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .light-control-panel .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.2s ease;
        }

        .light-control-panel .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .light-control-panel .slider-white {
            background: rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        @media (max-width: 420px) {
            .light-control-panel .color-swatch {
                width: 90px;
                height: 90px;
            }

            .light-control-panel .toggle-label,
            .mode-card .toggle-label {
                font-size: 14px;
            }
        }

        @media (max-width: 360px) {
            .light-control-panel .color-swatch {
                width: 72px;
                height: 72px;
            }
        }

        /* ===== 日志面板样式 ===== */
        .log-panel {
            --lp-text-dim: #a1a1aa;
            --lp-text-muted: #d4d4d8;
            --lp-text-main: #f0f0f2;
            --lp-card-border: rgba(255, 255, 255, 0.08);
            --lp-radius-md: 12px;
            --lp-radius-sm: 8px;
            background: rgba(14, 14, 18, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--lp-card-border);
            border-radius: var(--lp-radius-md);
            overflow: hidden;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .log-panel .log-header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .log-panel .log-header:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .log-panel .log-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .log-panel .log-chevron {
            width: 14px;
            height: 14px;
            color: var(--lp-text-dim);
            transform: rotate(-90deg);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .log-panel.open .log-chevron {
            transform: rotate(0deg);
        }

        .log-panel .log-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--lp-text-muted);
            letter-spacing: 0.2px;
        }

        .log-panel .log-count {
            font-size: 11px;
            font-weight: 600;
            color: var(--lp-text-dim);
            background: rgba(255, 255, 255, 0.07);
            padding: 1px 10px;
            border-radius: 20px;
            font-variant-numeric: tabular-nums;
        }

        .log-panel .log-actions {
            display: flex;
            gap: 4px;
        }

        .log-panel .btn-tool {
            background: transparent;
            border: none;
            color: var(--lp-text-dim);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: var(--lp-radius-sm);
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .log-panel .btn-tool:hover {
            color: var(--lp-text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .log-panel .log-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .log-panel.open .log-body {
            grid-template-rows: 1fr;
        }

        .log-panel .log-body-inner {
            overflow: hidden;
        }

        .log-panel .log-filter-bar {
            display: flex;
            gap: 4px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }

        .log-panel .filter-btn {
            background: transparent;
            border: none;
            color: var(--lp-text-dim);
            font-size: 11.5px;
            font-weight: 500;
            padding: 3px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .log-panel .filter-btn:hover {
            color: var(--lp-text-muted);
            background: rgba(255, 255, 255, 0.05);
        }

        .log-panel .filter-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--lp-text-main);
        }

        .log-panel .log {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12.5px;
            line-height: 1.7;
            padding: 14px;
            height: 200px;
            overflow-y: auto;
            color: var(--lp-text-main);
        }

        .log-panel .log-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
            opacity: 0;
            animation: fadeIn 0.2s forwards ease;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .log-panel .log-time {
            color: #71717a;
            font-size: 11px;
            white-space: nowrap;
            padding-top: 1px;
            font-variant-numeric: tabular-nums;
        }

        .log-panel .badge {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 42px;
            font-size: 10px;
            font-weight: 600;
            padding: 1px 0;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
        }

        .log-panel .badge-SEND {
            background: rgba(168, 85, 247, 0.18);
            color: #d8b4fe;
            border: 1px solid rgba(216, 180, 254, 0.20);
        }

        .log-panel .badge-RECE {
            background: rgba(59, 130, 246, 0.18);
            color: #93c5fd;
            border: 1px solid rgba(147, 197, 253, 0.20);
        }

        .log-panel .badge-INFO {
            background: rgba(255, 255, 255, 0.08);
            color: #d4d4d8;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .log-panel .log-data {
            color: #67e8f9;
            font-weight: 500;
        }

        /* 其他全局辅助 */
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <!-- 设备配置 -->

    {
        "id": "ESP-32S3-01",

    <!-- ===== 面板完整内容（头部 + 主体 + 底部） ===== -->
    <div class="flex flex-col h-full">

        <!-- 面板头部（完全复制原 index.html 头部结构） -->
        <div class="p-6 border-b border-white/10 flex items-start justify-between">
            <div>
                <div class="flex items-center space-x-2 mb-2">
                    <span id="panelDeviceType"
                        class="text-xs uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-white/5 text-zinc-300 mono border border-white/10">MCU
                        Hub</span>
                    <span id="panelDeviceStatus"
                        class="text-xs uppercase tracking-wider mono flex items-center font-medium">
                        <span id="statusOnline" class="text-emerald-400 flex items-center">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-2 animate-pulse"></span> ONLINE
                        </span>
                        <span id="statusOffline" class="text-red-400 hidden flex items-center">

                        </span>

                class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-zinc-400 hover:text-white transition-colors">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>

        </div>

            <div class="space-y-3">
                <h3 class="text-xs uppercase tracking-widest text-zinc-400 mono font-medium">硬件参数与地址</h3>

                        <span class="text-sm font-medium text-zinc-200 mono">-52 dBm</span>

                </div>

            <!-- 控制中心 -->
            <div class="space-y-3">
                <h3 class="text-xs uppercase tracking-widest text-zinc-400 mono font-medium">控制中心</h3>
                <!-- 工作模式卡片（独立卡片，位于灯光控制上方） -->
                <!-- 工作模式卡片（独立卡片，位于灯光控制上方） -->
                <div class="mode-card">
                    <div class="toggle-row">
                        <div class="toggle-label-group">
                            <span class="toggle-label">工作模式</span>
                        </div>
                        <!-- 右侧留空 -->
                    </div>
                    <div class="segment" id="modeSegment">
                        <div class="slider-indicator" id="modeSliderIndicator"></div>
                        <!-- mode-item 由 JS 动态生成 -->
                    </div>
                </div>

                <div class="light-control-panel">

                    <!-- 灯光开关 -->
                    <div class="toggle-row">
                        <div class="toggle-label-group">
                            <span class="toggle-label">灯光开关</span>
                            <span class="toggle-sublabel" id="toggleSublabel">已开启</span>
                        </div>
                        <div class="toggle-track checked" id="lightToggle" role="switch" aria-checked="true">
                            <div class="toggle-thumb"></div>
                        </div>
                    </div>

                    <!-- 灯泡可视化 -->
                    <div class="bulb-wrapper">
                        <div class="bulb-glow" id="bulbGlow"></div>
                        <div class="color-swatch" id="rgbColorDot"

                        <div class="color-info">
                            <span class="color-info-label">当前颜色</span>
                            <span class="color-info-hex" id="rgbHexReadout">#FF9D00</span>

                    <!-- 控制控件 -->
                    <div class="controls-wrap" id="controlsWrap">
                        <div class="controls-inner">
                            <!-- 亮度滑块（模式 3） -->
                            <div class="control-item hidden" id="rowBrightness">
                                <div class="control-header">
                                    <span>亮度 (Brightness)</span>
                                    <span class="control-val" id="valBrightness">100%</span>
                                </div>
                                <input type="range" class="slider" id="sliderBrightness" min="0" max="100" value="100">

                            <div class="control-item hidden" id="rowWhite">
                                <div class="control-header">
                                    <span>色温 / 白平衡</span>
                                    <span class="control-val" id="valWhite">125</span>
                                </div>
                                <input type="range" class="slider slider-white" id="sliderWhite" min="0" max="255"
                                    value="125">
                            </div>
                            <!-- HSL 滑块（模式 2） -->
                            <div class="control-item" id="rowRGB">
                                <div class="hsl-controls" style="display:flex; flex-direction:column; gap:12px;">
                                    <div class="control-item" style="gap:6px;">
                                        <div class="control-header">
                                            <span>色相 Hue</span>
                                            <span class="control-val" id="valHue">030°</span>
                                        </div>
                                        <input type="range" class="slider" id="sliderHue" min="0" max="360" value="30">
                                    </div>
                                    <div class="control-item" style="gap:6px;">
                                        <div class="control-header">
                                            <span>饱和度 Saturation</span>
                                            <span class="control-val" id="valSaturation">75%</span>
                                        </div>
                                        <input type="range" class="slider" id="sliderSaturation" min="0" max="100"
                                            value="75">
                                    </div>
                                    <div class="control-item" style="gap:6px;">
                                        <div class="control-header">
                                            <span>明度 Lightness</span>
                                            <span class="control-val" id="valLightness">50%</span>

                                        <input type="range" class="slider" id="sliderLightness" min="0" max="100"
                                            value="50">

                        </div>
                    </div>

                </div>
            </div>

            <!-- 通信日志 -->
            <div class="space-y-3">
                <h3 class="text-xs uppercase tracking-widest text-zinc-400 mono font-medium">通信日志</h3>
                <div class="log-panel" id="logPanel">
                    <div class="log-header" id="logHeader">
                        <div class="log-title-group">
                            <svg class="log-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                            <span class="log-title">控制台日志</span>
                            <span class="log-count" id="logCount">0</span>
                        </div>
                        <div class="log-actions">
                            <button class="btn-tool" id="btnCopyLog" type="button">复制</button>
                            <button class="btn-tool" id="btnClearLog" type="button">清空</button>
                        </div>
                    </div>
                    <div class="log-body">
                        <div class="log-body-inner">
                            <div class="log-filter-bar">
                                <button class="filter-btn active" data-filter="ALL">全部</button>
                                <button class="filter-btn" data-filter="SEND">SEND</button>
                                <button class="filter-btn" data-filter="RECE">RECE</button>
                            </div>
                            <div class="log" id="log"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <!-- 面板底部（完全复制原 index.html 底部结构） -->
        <div class="p-5 border-t border-white/10 flex items-center justify-between bg-black/20">
            <button
                class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 text-xs text-zinc-300 transition-colors mono">重启设备</button>
            <button onclick="window.closePanel()"
                class="px-5 py-2 rounded-lg bg-white text-black hover:bg-zinc-200 text-sm font-medium transition-colors">确认关闭</button>
        </div>

    </div>

    <!-- ===== 设备专属脚本（已重构：逻辑分层，命名统一，去除重复代码） ===== -->
    <!--
        通信约定（不可更改，需与外部宿主页面保持一致）：
        1. 接收设备状态：window.dataBus 派发 'MyDeviceInfoAdvChanged' 事件，
           数据体位于 e.detail.MyDeviceInfoAdv，其中 id === 1 时为本设备的数据。
        2. 发送控制指令：写入 window.sharedData.MySerAdv = { id: 1, state: {...} }。
        3. 共享设备信息缓存：window.sharedData.device_1_info，供本面板初始化及外部读取。
    -->
    <script>
        (function () {
            'use strict';

            // =====================================================================
            // 1. 常量定义
            // =====================================================================

            // 灯光工作模式编号（与设备通信协议一致，不可更改数值含义）
            const MODE = { SWITCH: 0, WHITE: 1, RGB: 2, BRIGHTNESS: 3 };

            // capability 字符串 -> 模式编号
            const CAPABILITY_TO_MODE = {
                switch: MODE.SWITCH,
                white: MODE.WHITE,
                rgb: MODE.RGB,
                brightness: MODE.BRIGHTNESS
            };

            // 模式在胶囊选择器中的展示顺序
            const CAPABILITY_ORDER = ['switch', 'brightness', 'white', 'rgb'];

            // 模式编号 -> 中文展示名
            const MODE_LABELS = {
                [MODE.SWITCH]: '开关',
                [MODE.BRIGHTNESS]: '亮度',
                [MODE.WHITE]: '色温',
                [MODE.RGB]: '彩光'
            };

            const PENDING_TIMEOUT_MS = 5000; // 指令下发后等待设备确认的超时时间
            const MAX_LOG_COUNT = 50;        // 通信日志最大保留条数
            const DEVICE_ID = 1;             // 本面板对应的设备 id（对应 device_1_info）

            const DEFAULT_STATE = {
                light: 1,
                mode: MODE.SWITCH,
                h: 30,
                s: 75,
                l: 50,
                brightness: 100,
                white: 125
            };

            // =====================================================================
            // 2. 颜色计算工具
            // =====================================================================

            function hslToHex(h, s, l) {
                s /= 100;
                l /= 100;
                const a = s * Math.min(l, 1 - l);
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
            }

            function hexToRgb(hex) {
                const n = parseInt(hex.slice(1), 16);
                return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            }

            function rgbToHsl(r, g, b) {
                r /= 255; g /= 255; b /= 255;
                const max = Math.max(r, g, b), min = Math.min(r, g, b);
                let h, s, l = (max + min) / 2;
                if (max === min) {
                    h = s = 0;
                } else {
                    const d = max - min;
                    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                    switch (max) {
                        case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                        case g: h = ((b - r) / d + 2) / 6; break;
                        case b: h = ((r - g) / d + 4) / 6; break;
                    }
                }
                return { h: Math.round(h * 360), s: Math.round(s * 100), l: Math.round(l * 100) };
            }

            // 色温（white 0~255）线性插值：暖橙 -> 白 -> 冷蓝
            function whiteToHsl(white) {
                const stops = [
                    { r: 255, g: 158, b: 68 },
                    { r: 255, g: 255, b: 255 },
                    { r: 163, g: 201, b: 255 }
                ];
                const t = white / 255;
                const [from, to, ratio] = t <= 0.5
                    ? [stops[0], stops[1], t / 0.5]
                    : [stops[1], stops[2], (t - 0.5) / 0.5];
                const r = Math.round(from.r + (to.r - from.r) * ratio);
                const g = Math.round(from.g + (to.g - from.g) * ratio);
                const b = Math.round(from.b + (to.b - from.b) * ratio);
                return rgbToHsl(r, g, b);
            }

            // 根据当前模式与状态，计算灯泡应显示的 HSL 颜色
            function computeBulbColor(state) {
                const { mode, brightness, white, h, s, l } = state;
                switch (mode) {
                    case MODE.SWITCH:
                        return { h: 0, s: 0, l: 100 };
                    case MODE.WHITE:
                        return whiteToHsl(white);
                    case MODE.RGB:
                        return { h, s, l };
                    case MODE.BRIGHTNESS:
                        return { h: 0, s: 0, l: brightness };
                    default:
                        return { h: 0, s: 0, l: 100 };
                }
            }

            // =====================================================================
            // 3. DOM 引用
            // =====================================================================

            const dom = {
                toggleTrack: document.getElementById('lightToggle'),
                toggleSublabel: document.getElementById('toggleSublabel'),
                bulbDot: document.getElementById('rgbColorDot'),
                bulbHex: document.getElementById('rgbHexReadout'),
                bulbGlow: document.getElementById('bulbGlow'),
                controlsWrap: document.getElementById('controlsWrap'),

                rowBrightness: document.getElementById('rowBrightness'),
                rowWhite: document.getElementById('rowWhite'),
                rowRGB: document.getElementById('rowRGB'),

                sliderBrightness: document.getElementById('sliderBrightness'),
                valBrightness: document.getElementById('valBrightness'),
                sliderWhite: document.getElementById('sliderWhite'),
                valWhite: document.getElementById('valWhite'),
                sliderHue: document.getElementById('sliderHue'),
                valHue: document.getElementById('valHue'),
                sliderSaturation: document.getElementById('sliderSaturation'),
                valSaturation: document.getElementById('valSaturation'),
                sliderLightness: document.getElementById('sliderLightness'),
                valLightness: document.getElementById('valLightness'),

                modeSegment: document.getElementById('modeSegment'),
                modeSliderIndicator: document.getElementById('modeSliderIndicator'),

                panelDeviceName: document.getElementById('panelDeviceName'),
                statusOnline: document.getElementById('statusOnline'),
                statusOffline: document.getElementById('statusOffline'),
                statusUnknown: document.getElementById('statusUnknown'),

                logEl: document.getElementById('log'),
                logCountEl: document.getElementById('logCount'),
                logPanel: document.getElementById('logPanel'),
                logHeader: document.getElementById('logHeader'),
                btnClearLog: document.getElementById('btnClearLog'),
                btnCopyLog: document.getElementById('btnCopyLog')
            };

            // =====================================================================
            // 4. 设备状态（本地模型）
            // =====================================================================

            const deviceInfo = {
                id: 0,
                name: null,
                online: null,
                capabilities: null,
                fw_version: null,
                mac: null,
                model: null,
                type: null,
                state: { ...DEFAULT_STATE }
            };

            // 指令下发后的"乐观更新 + 超时回退"状态机
            // kind: 'toggle' | 'slider'（模式切换复用 slider 的回退逻辑）
            const pending = {
                toggle: { active: false, timer: null },
                slider: { active: false, timer: null, revertState: null }
            };

            // =====================================================================
            // 5. 通信日志模块
            // =====================================================================

            const logModule = (function () {
                let rawLogs = [];
                let currentFilter = 'ALL';

                dom.logPanel.classList.remove('open');

                function formatMessage(msg) {
                    return msg.replace(/(\{[\s\S]*\})/g, '<span class="log-data">$1</span>');
                }

                function createLogLineEl(item) {
                    const line = document.createElement('div');
                    line.className = 'log-line';

                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'log-time';
                    timeSpan.textContent = item.time;

                    const badge = document.createElement('span');
                    badge.className = 'badge badge-' + item.type;
                    badge.textContent = item.type;

                    const content = document.createElement('span');
                    content.className = 'log-content';
                    content.innerHTML = formatMessage(item.msg);

                    line.appendChild(timeSpan);
                    line.appendChild(badge);
                    line.appendChild(content);
                    return line;
                }

                function renderAll() {
                    dom.logEl.innerHTML = '';
                    rawLogs
                        .filter(item => currentFilter === 'ALL' || item.type === currentFilter)
                        .forEach(item => dom.logEl.appendChild(createLogLineEl(item)));
                    dom.logEl.scrollTop = dom.logEl.scrollHeight;
                    dom.logCountEl.textContent = rawLogs.length;
                }

                function appendOne(item) {
                    dom.logEl.appendChild(createLogLineEl(item));
                    while (dom.logEl.children.length > MAX_LOG_COUNT) {
                        dom.logEl.removeChild(dom.logEl.firstChild);
                    }
                    dom.logEl.scrollTop = dom.logEl.scrollHeight;
                }

                function add(type, msg) {
                    const now = new Date();
                    const time = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
                    const item = { time, type, msg };

                    rawLogs.push(item);
                    if (rawLogs.length > MAX_LOG_COUNT) rawLogs.shift();

                    if (currentFilter === 'ALL' || currentFilter === type) {
                        appendOne(item);
                    } else {
                        renderAll();
                    }
                    dom.logCountEl.textContent = rawLogs.length;
                }

                function clear() {
                    rawLogs = [];
                    renderAll();
                }

                function setFilter(filter) {
                    currentFilter = filter;
                    renderAll();
                }

                function exportAsText() {
                    return rawLogs.map(i => `[${i.time}] [${i.type}] ${i.msg}`).join('\n');
                }

                // ---- 事件绑定 ----
                dom.logHeader.addEventListener('click', function (e) {
                    if (e.target.closest('.btn-tool')) return;
                    dom.logPanel.classList.toggle('open');
                });

                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        setFilter(this.dataset.filter);
                    });
                });

                dom.btnClearLog.addEventListener('click', clear);

                // 兼容降级：优先使用 Clipboard API，不可用时回退到 execCommand
                function copyTextFallback(text) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    textarea.style.top = '0';
                    textarea.style.left = '0';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    let ok = false;
                    try {
                        ok = document.execCommand('copy');
                    } catch (err) {
                        ok = false;
                    }
                    document.body.removeChild(textarea);
                    return ok;
                }

                dom.btnCopyLog.addEventListener('click', async function () {
                    const text = exportAsText();
                    try {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(text);
                            add('INFO', '日志已复制到剪贴板');
                        } else if (copyTextFallback(text)) {
                            add('INFO', '日志已复制到剪贴板');
                        } else {
                            add('INFO', '当前环境不支持复制到剪贴板');
                        }
                    } catch (e) {
                        // Clipboard API 失败（如非安全上下文）时再尝试一次降级方案
                        if (copyTextFallback(text)) {
                            add('INFO', '日志已复制到剪贴板');
                        } else {
                            add('INFO', '复制失败: ' + e.message);
                        }
                    }
                });

                return { add };
            })();

            // 暴露给外部（例如宿主页面）追加日志的入口，保持原有全局钩子名
            window._logPanelLog = logModule.add;

            // =====================================================================
            // 6. sharedData 代理：拦截 MySerAdv 赋值以自动记录 SEND 日志
            //    （通信通道名 sharedData / MySerAdv 属于外部约定，不可更改）
            // =====================================================================

            (function setupSharedDataLogProxy() {
                const original = window.sharedData || {};

                // 部分老旧 WebView（如低版本 Android System WebView）不支持 Proxy，
                // 此时降级为普通对象，跳过自动 SEND 日志拦截，但不影响通信本身。
                if (typeof Proxy === 'undefined' || typeof Object.defineProperty !== 'function') {
                    window.sharedData = original;
                    console.warn('当前环境不支持 Proxy，SEND 日志自动记录功能不可用');
                    return;
                }

                try {
                    const handler = {
                        set(target, prop, value) {
                            if (prop === 'MySerAdv') {
                                const display = typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value);
                                logModule.add('SEND', display);
                            }
                            target[prop] = value;
                            return true;
                        },
                        get(target, prop) {
                            return target[prop];
                        }
                    };
                    const proxy = new Proxy(original, handler);
                    Object.defineProperty(window, 'sharedData', {
                        get: function () { return proxy; },
                        set: function () { console.warn('sharedData 被重新赋值，忽略'); },
                        configurable: true
                    });
                } catch (err) {
                    // defineProperty 失败（例如已被其他脚本定义为不可配置属性）时优雅降级
                    console.warn('sharedData 代理设置失败，回退为普通对象:', err);
                    window.sharedData = original;
                }
            })();

            // =====================================================================
            // 7. 模式胶囊（segmented control）渲染
            // =====================================================================

            function normalizeCapabilities(capabilities) {
                if (Array.isArray(capabilities)) return capabilities;
                if (typeof capabilities === 'string') return capabilities.split(',').map(s => s.trim());
                return ['switch'];
            }

            function buildModeItems(capabilities) {
                const capsArray = normalizeCapabilities(capabilities);
                const available = CAPABILITY_ORDER.filter(key => capsArray.includes(key));
                if (available.length === 0) available.push('switch');

                // 清空现有 item（保留 indicator）
                dom.modeSegment.querySelectorAll('.mode-item').forEach(el => el.remove());

                available.forEach(key => {
                    const modeNum = CAPABILITY_TO_MODE[key];
                    const item = document.createElement('div');
                    item.className = 'mode-item';
                    item.dataset.mode = modeNum;
                    item.textContent = MODE_LABELS[modeNum];
                    item.addEventListener('click', function () {
                        const newMode = parseInt(this.dataset.mode, 10);
                        if (newMode !== deviceInfo.state.mode) {
                            deviceInfo.state.mode = newMode;
                            updateUIFromState(deviceInfo.state);
                            sendState('mode');
                        }
                    });
                    dom.modeSegment.appendChild(item);
                });
            }

            // 兼容极少数不支持 requestAnimationFrame 的环境
            const scheduleFrame = typeof requestAnimationFrame === 'function'
                ? requestAnimationFrame
                : (cb) => setTimeout(cb, 16);

            function updateIndicatorPosition(activeIndex) {
                const items = dom.modeSegment.querySelectorAll('.mode-item');
                if (!items.length || activeIndex >= items.length) return;

                scheduleFrame(() => {
                    const segWidth = dom.modeSegment.clientWidth;
                    if (segWidth === 0) {
                        setTimeout(() => updateIndicatorPosition(activeIndex), 50);
                        return;
                    }
                    const gap = 6;
                    const itemWidth = (segWidth - gap) / items.length;
                    dom.modeSliderIndicator.style.width = (itemWidth - 2) + 'px';
                    dom.modeSliderIndicator.style.left = (3 + activeIndex * itemWidth) + 'px';
                });
            }

            function highlightMode(modeNum) {
                const items = dom.modeSegment.querySelectorAll('.mode-item');
                let activeIndex = -1;
                items.forEach((item, index) => {
                    const isActive = parseInt(item.dataset.mode, 10) === modeNum;
                    item.classList.toggle('active', isActive);
                    if (isActive) activeIndex = index;
                });
                // 未找到匹配项时，默认高亮第一个
                if (activeIndex === -1 && items.length > 0) {
                    items[0].classList.add('active');
                    activeIndex = 0;
                }
                if (activeIndex !== -1) updateIndicatorPosition(activeIndex);
            }

            // =====================================================================
            // 8. 灯泡颜色渲染
            // =====================================================================

            function paintBulb(hslColor) {
                const hex = hslToHex(hslColor.h, hslColor.s, hslColor.l);
                const [r, g, b] = hexToRgb(hex);
                dom.bulbHex.textContent = hex;
                dom.bulbDot.style.backgroundColor = hex;
                dom.bulbDot.style.boxShadow = `0 0 80px rgba(${r},${g},${b},0.6)`;
                dom.bulbGlow.style.background = `radial-gradient(circle, rgba(${r},${g},${b},0.18), transparent 55%)`;
            }

            // 滑块拖动过程中的实时预览：仅在预览的字段属于当前模式时生效
            function previewBulbIfRelevant(mode, overrideField, overrideValue) {
                if (deviceInfo.state.mode !== mode) return;
                const previewState = { ...deviceInfo.state, [overrideField]: overrideValue };
                paintBulb(computeBulbColor(previewState));
            }

            // =====================================================================
            // 9. 控件可见性 & 整体 UI 刷新
            // =====================================================================

            function updateControlsVisibility(mode, lightOn) {
                dom.controlsWrap.classList.toggle('disabled', !lightOn);

                dom.rowBrightness.classList.toggle('hidden', mode !== MODE.BRIGHTNESS);
                dom.rowWhite.classList.toggle('hidden', mode !== MODE.WHITE);
                dom.rowRGB.classList.toggle('hidden', mode !== MODE.RGB);
            }

            function updateUIFromState(state) {
                const isOn = state.light === 1;

                // 开关
                dom.toggleTrack.classList.toggle('checked', isOn);
                dom.toggleTrack.setAttribute('aria-checked', String(isOn));
                dom.toggleSublabel.textContent = isOn ? '已开启' : '已关闭';

                // 灯泡显隐 + 颜色
                dom.bulbDot.classList.toggle('light-off', !isOn);
                dom.bulbGlow.classList.toggle('light-off', !isOn);
                paintBulb(computeBulbColor(state));

                // 滑块数值
                dom.sliderBrightness.value = state.brightness;
                dom.valBrightness.textContent = `${state.brightness}%`;
                dom.sliderWhite.value = state.white;
                dom.valWhite.textContent = state.white;
                dom.sliderHue.value = state.h;
                dom.valHue.textContent = String(state.h).padStart(3, '0') + '°';
                dom.sliderSaturation.value = state.s;
                dom.valSaturation.textContent = `${state.s}%`;
                dom.sliderLightness.value = state.l;
                dom.valLightness.textContent = `${state.l}%`;

                // 模式胶囊 & 控件可见性
                highlightMode(state.mode);
                updateControlsVisibility(state.mode, isOn);
            }

            function updateDeviceName(name) {
                if (dom.panelDeviceName && name) {
                    dom.panelDeviceName.textContent = name;
                }
            }

            function updatePanelStatus(online) {
                if (!dom.statusOnline || !dom.statusOffline || !dom.statusUnknown) return;
                dom.statusOnline.classList.add('hidden');
                dom.statusOffline.classList.add('hidden');
                dom.statusUnknown.classList.add('hidden');

                if (online === true || online === 1 || online === 'online' || online === 'ONLINE') {
                    dom.statusOnline.classList.remove('hidden');
                } else if (online === false || online === 0 || online === 'offline' || online === 'OFFLINE') {
                    dom.statusOffline.classList.remove('hidden');
                } else {
                    dom.statusUnknown.classList.remove('hidden');
                }
            }

            // =====================================================================
            // 10. 指令下发（乐观更新 + 超时回退）
            // =====================================================================

            function clearPendingToggle() {
                pending.toggle.active = false;
                dom.toggleTrack.classList.remove('pending');
                if (pending.toggle.timer) {
                    clearTimeout(pending.toggle.timer);
                    pending.toggle.timer = null;
                }
            }

            function clearPendingSlider() {
                pending.slider.active = false;
                if (pending.slider.timer) {
                    clearTimeout(pending.slider.timer);
                    pending.slider.timer = null;
                }
            }

            function revertToggleOnTimeout(revertState) {
                pending.toggle.timer = setTimeout(() => {
                    if (!pending.toggle.active) return;
                    clearPendingToggle();
                    deviceInfo.state = { ...revertState };
                    updateUIFromState(deviceInfo.state);
                    console.warn('⏰ 开关超时，回退到之前状态');
                    logModule.add('INFO', '开关超时，回退');
                }, PENDING_TIMEOUT_MS);
            }

            function revertSliderOnTimeout(revertState, timeoutLogMsg) {
                pending.slider.timer = setTimeout(() => {
                    if (!pending.slider.active) return;
                    clearPendingSlider();
                    deviceInfo.state = { ...revertState };
                    updateUIFromState(deviceInfo.state);
                    console.warn('⏰ ' + timeoutLogMsg);
                    logModule.add('INFO', timeoutLogMsg);
                }, PENDING_TIMEOUT_MS);
            }

            // cause: 'toggle' | 'slider' | 'mode'
            function sendState(cause) {
                const revertState = { ...deviceInfo.state };

                if (cause === 'toggle') {
                    if (pending.toggle.active) return; // 已有指令在途，忽略
                    pending.toggle.active = true;
                    dom.toggleTrack.classList.add('pending');
                    clearTimeout(pending.toggle.timer);
                    revertToggleOnTimeout(revertState);
                } else {
                    // 滑块 / 模式切换共用同一套回退机制
                    clearPendingSlider();
                    pending.slider.active = true;
                    pending.slider.revertState = revertState;
                    const timeoutMsg = cause === 'mode' ? '模式切换超时，回退' : '滑块超时，回退';
                    revertSliderOnTimeout(revertState, timeoutMsg);
                }

                const payload = {
                    id: DEVICE_ID,
                    state: {
                        light: deviceInfo.state.light,
                        mode: deviceInfo.state.mode,
                        h: deviceInfo.state.h,
                        s: deviceInfo.state.s,
                        l: deviceInfo.state.l,
                        brightness: deviceInfo.state.brightness,
                        white: deviceInfo.state.white
                    }
                };

                if (window.sharedData) {
                    window.sharedData.MySerAdv = payload; // 触发上面的日志代理记录 SEND
                    console.log('📤 发送指令:', payload);
                } else {
                    console.warn('sharedData 不可用');
                }
            }

            // =====================================================================
            // 11. 用户交互事件绑定
            // =====================================================================

            dom.toggleTrack.addEventListener('click', function () {
                if (pending.toggle.active) {
                    console.log('⏳ 开关等待确认中，忽略本次点击');
                    return;
                }
                deviceInfo.state.light = deviceInfo.state.light === 1 ? 0 : 1;
                updateUIFromState(deviceInfo.state); // 乐观更新
                sendState('toggle');
            });

            // 亮度滑块
            dom.sliderBrightness.addEventListener('input', function () {
                const val = parseInt(this.value, 10);
                dom.valBrightness.textContent = `${val}%`;
                previewBulbIfRelevant(MODE.BRIGHTNESS, 'brightness', val);
            });
            dom.sliderBrightness.addEventListener('change', function () {
                deviceInfo.state.brightness = parseInt(this.value, 10);
                sendState('slider');
            });

            // 色温滑块
            dom.sliderWhite.addEventListener('input', function () {
                const val = parseInt(this.value, 10);
                dom.valWhite.textContent = val;
                previewBulbIfRelevant(MODE.WHITE, 'white', val);
            });
            dom.sliderWhite.addEventListener('change', function () {
                deviceInfo.state.white = parseInt(this.value, 10);
                sendState('slider');
            });

            // 色相滑块
            dom.sliderHue.addEventListener('input', function () {
                const val = parseInt(this.value, 10);
                dom.valHue.textContent = String(val).padStart(3, '0') + '°';
                previewBulbIfRelevant(MODE.RGB, 'h', val);
            });
            dom.sliderHue.addEventListener('change', function () {
                deviceInfo.state.h = parseInt(this.value, 10);
                sendState('slider');
            });

            // 饱和度滑块
            dom.sliderSaturation.addEventListener('input', function () {
                const val = parseInt(this.value, 10);
                dom.valSaturation.textContent = `${val}%`;
                previewBulbIfRelevant(MODE.RGB, 's', val);
            });
            dom.sliderSaturation.addEventListener('change', function () {
                deviceInfo.state.s = parseInt(this.value, 10);
                sendState('slider');
            });

            // 明度滑块
            dom.sliderLightness.addEventListener('input', function () {
                const val = parseInt(this.value, 10);
                dom.valLightness.textContent = `${val}%`;
                previewBulbIfRelevant(MODE.RGB, 'l', val);
            });
            dom.sliderLightness.addEventListener('change', function () {
                deviceInfo.state.l = parseInt(this.value, 10);
                sendState('slider');
            });

            // =====================================================================
            // 12. 接收外部设备数据（来自 dataBus）
            // =====================================================================

            function mergeState(oldState, incomingState) {
                let parsed = incomingState;
                if (typeof incomingState === 'string') {
                    try {
                        parsed = JSON.parse(incomingState);
                    } catch (err) {
                        console.warn('设备 state 解析失败，忽略本次更新:', err, incomingState);
                        logModule.add('INFO', 'state 数据解析失败，已忽略');
                        return oldState;
                    }
                }
                if (!parsed || typeof parsed !== 'object') return oldState;
                ['light', 'mode', 'brightness', 'white', 'h', 's', 'l'].forEach(key => {
                    if (parsed[key] !== undefined) oldState[key] = parsed[key];
                });
                return oldState;
            }

            function applyCapabilities(capabilities) {
                const caps = normalizeCapabilities(capabilities);
                deviceInfo.capabilities = caps;
                buildModeItems(caps);

                // 若当前模式不在新的能力列表中，自动切换到第一个可用模式
                const availableModes = caps.map(key => CAPABILITY_TO_MODE[key]);
                if (!availableModes.includes(deviceInfo.state.mode)) {
                    deviceInfo.state.mode = availableModes.length > 0 ? availableModes[0] : MODE.SWITCH;
                }
            }

            function updateDeviceInfo(data) {
                try {
                    updateDeviceInfoUnsafe(data);
                } catch (err) {
                    console.error('处理设备数据时出错:', err, data);
                    logModule.add('INFO', '处理设备数据时出错: ' + err.message);
                }
            }

            function updateDeviceInfoUnsafe(data) {
                console.log('data.online', data.online);
                console.log('deviceInfo.online', deviceInfo.online);
                if (data.online !== undefined ) {
                    deviceInfo.online = data.online;
                    updatePanelStatus(deviceInfo.online);
                }

                if (data.name ) {
                    deviceInfo.name = data.name;
                    updateDeviceName(deviceInfo.name);
                }

                if (data.state) {
                    mergeState(deviceInfo.state, data.state);

                    // 收到设备确认，解除对应的 pending 回退定时器
                    if (pending.toggle.active) {
                        clearPendingToggle();
                        console.log('✅ 开关确认收到，pending 解除');
                    }
                    if (pending.slider.active) {
                        clearPendingSlider();
                        console.log('✅ 滑块/模式确认收到，pending 解除');
                    }

                    updateUIFromState(deviceInfo.state);
                }

                if (data.capabilities) {
                    applyCapabilities(data.capabilities);
                }

                // 回写共享缓存，供外部读取（通道名固定，不可更改）
                if (window.sharedData) {
                    window.sharedData.device_1_info = deviceInfo;
                }
            }

            // =====================================================================
            // 13. 初始化
            // =====================================================================

            function initFromSharedData() {
                const initialInfo = window.sharedData && window.sharedData.device_1_info;
                if (!initialInfo || typeof initialInfo !== 'object') {
                    buildModeItems(['switch']);
                    updateUIFromState(deviceInfo.state);
                    return;
                }

                Object.assign(deviceInfo, initialInfo);
                if (!deviceInfo.state || typeof deviceInfo.state !== 'object') {
                    deviceInfo.state = { ...DEFAULT_STATE };
                } else {
                    // 补全缺失字段，避免上游缓存的数据不完整导致渲染出错
                    deviceInfo.state = { ...DEFAULT_STATE, ...deviceInfo.state };
                }

                updateDeviceName(deviceInfo.name);
                updatePanelStatus(deviceInfo.online);
                buildModeItems(deviceInfo.capabilities || ['switch']);
                updateUIFromState(deviceInfo.state);

                console.log('deviceInfo', deviceInfo);
            }

            // 统一处理 dataBus 事件：先记录 RECE 日志，再更新设备信息
            function handleDeviceInfoAdvChanged(e) {
                const data = e && e.detail && e.detail.MyDeviceInfoAdv;
                if (!data || data.id !== DEVICE_ID) return;

                const display = typeof data === 'object' ? JSON.stringify(data, null, 2) : String(data);
                logModule.add('RECE', display);
                updateDeviceInfo(data);
            }

            const DATA_BUS_RETRY_INTERVAL_MS = 200;
            const DATA_BUS_RETRY_MAX_ATTEMPTS = 25; // 最长约 5 秒，覆盖宿主页面异步创建 dataBus 的情况

            function bindDataBus(attempt) {
                const bus = window.dataBus;
                if (bus && typeof bus.addEventListener === 'function') {
                    bus.addEventListener('MyDeviceInfoAdvChanged', handleDeviceInfoAdvChanged);
                    return;
                }
                const nextAttempt = (attempt || 0) + 1;
                if (nextAttempt > DATA_BUS_RETRY_MAX_ATTEMPTS) {
                    console.warn('window.dataBus 未就绪，放弃重试，设备数据将无法自动更新');
                    return;
                }
                setTimeout(() => bindDataBus(nextAttempt), DATA_BUS_RETRY_INTERVAL_MS);
            }

            logModule.add('INFO', '日志系统已启动，等待通信数据...');

            try {
                initFromSharedData();
            } catch (err) {
                console.error('初始化设备状态失败:', err);
                logModule.add('INFO', '初始化设备状态失败: ' + err.message);
            }
            bindDataBus();

            console.log('✅ Matrix Core 控制器已启动 (增强模式)');
        })();
    </script>

</body>
