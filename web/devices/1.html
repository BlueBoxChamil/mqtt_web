<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

<body>

    <style>
        /* ===== 灯光控制 UI 样式（完全复制自原 index.html 内嵌样式） ===== */
        .light-control-panel {
            --lp-text-main: #f0f0f2;
            --lp-text-muted: #d4d4d8;
            --lp-text-dim: #a1a1aa;
            --lp-card-border: rgba(255, 255, 255, 0.10);
            --lp-row-bg: rgba(255, 255, 255, 0.04);
            --lp-row-border: rgba(255, 255, 255, 0.07);
            --lp-input-bg: rgba(0, 0, 0, 0.5);
            --lp-radius-sm: 8px;
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border: 1px solid var(--lp-card-border);
            border-radius: 16px;
            padding: 24px 24px 20px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--lp-text-main);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .light-control-panel .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0 0;
        }

        .light-control-panel .toggle-label-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .light-control-panel .toggle-label {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--lp-text-main);
        }

        .light-control-panel .toggle-sublabel {
            font-size: 13px;
            color: var(--lp-text-dim);
            font-weight: 450;
        }

        .light-control-panel .toggle-track {
            position: relative;
            width: 50px;
            height: 28px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 999px;
            cursor: default;
            flex-shrink: 0;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            transition: background 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .light-control-panel .toggle-track.checked {
            background: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .light-control-panel .toggle-thumb {
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                width 0.2s cubic-bezier(0.16, 1, 0.3, 1),
                background-color 0.2s ease;
        }

        .light-control-panel .toggle-track.checked .toggle-thumb {
            transform: translateX(22px);
            background: #0a0a0c;
        }

        .light-control-panel .toggle-track.pending {
            cursor: default;
            pointer-events: none;
            animation: togglePulse 1s ease-in-out infinite;
        }

        @keyframes togglePulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .light-control-panel .bulb-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 16px 0 10px;
            padding: 20px 0 8px;
        }

        .light-control-panel .bulb-glow {
            position: absolute;
            top: -20px;
            left: -20px;
            right: -20px;
            bottom: -20px;
            background: radial-gradient(circle, rgba(255, 157, 0, 0.18), transparent 55%);
            filter: blur(50px);
            pointer-events: none;
            transform: scale(0.9);
            animation: rgbGlowBreathe 6s infinite alternate;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 1;
        }

        .light-control-panel .bulb-glow.light-off {
            opacity: 0;
            animation: none;
            transform: scale(0.85);
        }

        @keyframes rgbGlowBreathe {
            0% {
                transform: scale(0.9);
                opacity: 0.5;
            }

            100% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        .light-control-panel .color-swatch {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #ff9d00;
            box-shadow: 0 0 80px rgba(255, 157, 0, 0.5);
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1),
                transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            transform: scale(1);
            opacity: 1;
            position: relative;
            z-index: 1;
        }

        .light-control-panel .color-swatch.light-off {
            transform: scale(0.1);
            opacity: 0;
            filter: brightness(0.2);
            pointer-events: none;
        }

        .light-control-panel .color-info {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .light-control-panel .color-info-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--lp-text-muted);
        }

        .light-control-panel .color-info-hex {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12.5px;
            color: var(--lp-text-dim);
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 12px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .light-control-panel .controls-wrap {
            display: block;
            margin-top: 18px;
            opacity: 1;
        }

        .light-control-panel .controls-wrap.disabled {
            opacity: 0.30;
            pointer-events: none;
        }

        .light-control-panel .controls-inner {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 6px 4px 4px 4px;
        }

        .light-control-panel .control-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .light-control-panel .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 500;
            color: var(--lp-text-muted);
        }

        .light-control-panel .control-val {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12px;
            color: var(--lp-text-dim);
            background: rgba(255, 255, 255, 0.04);
            padding: 0 10px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .light-control-panel .slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            outline: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            transition: box-shadow 0.2s ease;
        }

        .light-control-panel .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .light-control-panel .slider-white {
            background: rgba(255, 255, 255, 0.07);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        @media (max-width: 420px) {
            .light-control-panel .color-swatch {
                width: 90px;
                height: 90px;
            }

            .light-control-panel .toggle-label {
                font-size: 14px;
            }
        }

        @media (max-width: 360px) {
            .light-control-panel .color-swatch {
                width: 72px;
                height: 72px;
            }
        }

        /* ===== 日志面板样式 ===== */
        .log-panel {
            --lp-text-dim: #a1a1aa;
            --lp-text-muted: #d4d4d8;
            --lp-text-main: #f0f0f2;
            --lp-card-border: rgba(255, 255, 255, 0.08);
            --lp-radius-md: 12px;
            --lp-radius-sm: 8px;
            background: rgba(14, 14, 18, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid var(--lp-card-border);
            border-radius: var(--lp-radius-md);
            overflow: hidden;
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .log-panel .log-header {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .log-panel .log-header:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .log-panel .log-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .log-panel .log-chevron {
            width: 14px;
            height: 14px;
            color: var(--lp-text-dim);
            transform: rotate(-90deg);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .log-panel.open .log-chevron {
            transform: rotate(0deg);
        }

        .log-panel .log-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--lp-text-muted);
            letter-spacing: 0.2px;
        }

        .log-panel .log-count {
            font-size: 11px;
            font-weight: 600;
            color: var(--lp-text-dim);
            background: rgba(255, 255, 255, 0.07);
            padding: 1px 10px;
            border-radius: 20px;
            font-variant-numeric: tabular-nums;
        }

        .log-panel .log-actions {
            display: flex;
            gap: 4px;
        }

        .log-panel .btn-tool {
            background: transparent;
            border: none;
            color: var(--lp-text-dim);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: var(--lp-radius-sm);
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .log-panel .btn-tool:hover {
            color: var(--lp-text-main);
            background: rgba(255, 255, 255, 0.08);
        }

        .log-panel .log-body {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .log-panel.open .log-body {
            grid-template-rows: 1fr;
        }

        .log-panel .log-body-inner {
            overflow: hidden;
        }

        .log-panel .log-filter-bar {
            display: flex;
            gap: 4px;
            padding: 8px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
        }

        .log-panel .filter-btn {
            background: transparent;
            border: none;
            color: var(--lp-text-dim);
            font-size: 11.5px;
            font-weight: 500;
            padding: 3px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s ease;
        }

        .log-panel .filter-btn:hover {
            color: var(--lp-text-muted);
            background: rgba(255, 255, 255, 0.05);
        }

        .log-panel .filter-btn.active {
            background: rgba(255, 255, 255, 0.12);
            color: var(--lp-text-main);
        }

        .log-panel .log {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 12.5px;
            line-height: 1.7;
            padding: 14px;
            height: 200px;
            overflow-y: auto;
            color: var(--lp-text-main);
        }

        .log-panel .log-line {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 6px;
            opacity: 0;
            animation: fadeIn 0.2s forwards ease;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .log-panel .log-time {
            color: #71717a;
            font-size: 11px;
            white-space: nowrap;
            padding-top: 1px;
            font-variant-numeric: tabular-nums;
        }

        .log-panel .badge {
            font-size: 10px;
            font-weight: 600;
            padding: 1px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
        }

        .log-panel .badge-SEND {
            background: rgba(168, 85, 247, 0.18);
            color: #d8b4fe;
            border: 1px solid rgba(216, 180, 254, 0.20);
        }

        .log-panel .badge-RECE {
            background: rgba(59, 130, 246, 0.18);
            color: #93c5fd;
            border: 1px solid rgba(147, 197, 253, 0.20);
        }

        .log-panel .badge-INFO {
            background: rgba(255, 255, 255, 0.08);
            color: #d4d4d8;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .log-panel .log-data {
            color: #67e8f9;
            font-weight: 500;
        }

        /* 其他全局辅助 */
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <script>
        (function () {
            // ---------- 获取节点名称并更新标题 ----------
            function updateDeviceName(name) {
                const nameEl = document.getElementById('panelDeviceName');
                if (nameEl && name) {
                    nameEl.textContent = name;
                }
            }

            function updatePanelStatus(online) {
                const onlineEl = document.getElementById('statusOnline');
                const offlineEl = document.getElementById('statusOffline');
                const unknownEl = document.getElementById('statusUnknown');
                if (!onlineEl || !offlineEl || !unknownEl) return;

                // 先全部隐藏
                onlineEl.classList.add('hidden');
                offlineEl.classList.add('hidden');
                unknownEl.classList.add('hidden');

                // 根据状态显示对应的标签
                if (online === true || online === 1 || online === 'online' || online === 'ONLINE') {
                    onlineEl.classList.remove('hidden');
                } else if (online === false || online === 0 || online === 'offline' || online === 'OFFLINE') {
                    offlineEl.classList.remove('hidden');
                } else {
                    // 其他值（null、undefined、'unknown' 等）视为 UNKNOWN
                    unknownEl.classList.remove('hidden');
                }
            }

            // if (deviceName) {

            // }

            // 初始从 window._currentPanelNode 读取

                    typeEl.textContent = node.type;
                }
                // 状态更新（可简化，因后续数据会覆盖）
            }


            function updateDeviceInfo(data) {
                if (isValidDeviceData(data, 'online') && data.online !== device_info.online) {
                    device_info.online = data.online;
                    console.log('已更新在线状态:', device_info.online);
                    updatePanelStatus(device_info.online);
                }

                if (isValidDeviceData(data, 'name') && data.name !== device_info.name) {
                    device_info.name = data.name;
                    console.log('已更新设备名字:', device_info.name);
                    updateDeviceName(device_info.name);
                }

                if (isValidDeviceData(data, 'state')) {
                    const ds = data.state;
                    const devState = device_info.state;

                    if (isValidDeviceData(ds, 'mode') && ds.mode !== devState.mode) {
                        devState.mode = ds.mode;
                    }
                    if (isValidDeviceData(ds, 'light') && ds.light !== devState.light) {
                        devState.light = ds.light;
                    }
                    if (isValidDeviceData(ds, 'brightness') && ds.brightness !== devState.brightness) {
                        devState.brightness = ds.brightness;
                    }
                    if (isValidDeviceData(ds, 'h') &&
                        isValidDeviceData(ds, 's') &&
                        isValidDeviceData(ds, 'l')) {
                        if (ds.h !== devState.h) {
                            devState.h = ds.h;
                        }
                        if (ds.s !== devState.s) {
                            devState.s = ds.s;
                        }
                        if (ds.l !== devState.l) {
                            devState.l = ds.l;
                        }

                    }
                    if (isValidDeviceData(ds, 'white') && ds.white !== devState.white) {
                        devState.white = ds.white;
                    }
                    updateUIFromState(device_info.state);
                    // 🔽 关键修复：同步清除 pending 状态，防止超时回退
                    if (togglePending) {
                        togglePending = false;
                        toggleTrack.classList.remove('pending');
                        if (toggleTimer) { clearTimeout(toggleTimer); toggleTimer = null; }
                        console.log('✅ 通过 MyDeviceInfoAdv 确认开关，pending 解除');
                    }
                    if (sliderPending) {
                        sliderPending = false;
                        if (sliderTimer) { clearTimeout(sliderTimer); sliderTimer = null; }
                        console.log('✅ 通过 MyDeviceInfoAdv 确认滑块，pending 解除');
                    }
                    // 同步 lastSyncedState，保持一致性
                    lastSyncedState = { ...device_info.state };
                }

                window.sharedData.device_1_info = device_info;
            }

            // 监听共享数据更新名称
            const bus = window.dataBus;
            if (bus) {
                bus.addEventListener('MyDeviceInfoAdvChanged', function (e) {
                    const data = e.detail.MyDeviceInfoAdv;
                    if (data.id !== 1)
                        return;

                    console.log('请求更新设备信息:', data);
                    updateDeviceInfo(data);

                });
            }




            function isValidDeviceData(data, ...fieldNames) {
                // 如果第一个参数是数组，则将其展开为字段列表
                if (fieldNames.length === 1 && Array.isArray(fieldNames[0])) {
                    fieldNames = fieldNames[0];
                }
                // 如果没有任何字段，直接返回 false（或 true 取决于业务）
                if (fieldNames.length === 0) return false;

                // 检查所有字段是否存在
                const allExist = fieldNames.every(field => data.hasOwnProperty(field));
                if (!allExist) return false;

                // 递归检查字段值是否有效（非空）
                function isValueValid(value) {
                    if (value === null || value === undefined) return false;
                    if (typeof value === 'string' && value.trim() === '') return false;
                    if (typeof value === 'object' && !Array.isArray(value)) {
                        for (let key in value) {
                            if (value.hasOwnProperty(key) && !isValueValid(value[key])) {
                                return false;
                            }
                        }
                        return true;
                    }
                    if (Array.isArray(value)) {
                        for (let item of value) {
                            if (!isValueValid(item)) return false;
                        }
                        return true;
                    }
                    return true;
                }

                // 对每个必需字段的值进行递归校验
                for (let field of fieldNames) {
                    if (!isValueValid(data[field])) return false;
                }
                return true;
            }


            // ---------- 原有的灯光控制、日志等所有脚本 ----------
            // 以下代码完全复制自原 1.html 的脚本部分，保持功能不变
            // 注意：由于现在整个面板都在子页面内，这些脚本依然有效

            const toggleTrack = document.getElementById('lightToggle');
            const toggleSublabel = document.getElementById('toggleSublabel');
            const dot = document.getElementById('rgbColorDot');
            const hexReadout = document.getElementById('rgbHexReadout');
            const glow = document.getElementById('bulbGlow');
            const controlsWrap = document.getElementById('controlsWrap');

            const sliderHue = document.getElementById('sliderHue');
            const sliderSat = document.getElementById('sliderSaturation');
            const sliderLight = document.getElementById('sliderLightness');
            const valHue = document.getElementById('valHue');
            const valSat = document.getElementById('valSaturation');
            const valLight = document.getElementById('valLightness');

            // 状态
            let lastSyncedState = {
                light: 1,
                mode: 2,
                h: 30,
                s: 75,
                l: 50,
                brightness: 100,
                white: 125
            };
            let togglePending = false;
            let toggleTimer = null;
            let sliderPending = false;
            let sliderTimer = null;
            let sliderRevertState = null;

            function hslToHex(h, s, l) {
                s /= 100;
                l /= 100;
                const a = s * Math.min(l, 1 - l);
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
            }

            function updateUIFromState(state) {
                const isOn = state.light === 1;
                toggleTrack.classList.toggle('checked', isOn);
                toggleTrack.setAttribute('aria-checked', String(isOn));
                toggleSublabel.textContent = isOn ? '已开启' : '已关闭';

                sliderHue.value = state.h;
                sliderSat.value = state.s;
                sliderLight.value = state.l;
                valHue.textContent = String(state.h).padStart(3, '0') + '°';
                valSat.textContent = state.s + '%';
                valLight.textContent = state.l + '%';

                const hex = hslToHex(state.h, state.s, state.l);
                hexReadout.textContent = hex;
                dot.style.backgroundColor = hex;
                dot.style.boxShadow = `0 0 80px ${hex}80`;
                glow.style.background = `radial-gradient(circle, ${hex}30, transparent 55%)`;

                dot.classList.toggle('light-off', !isOn);
                glow.classList.toggle('light-off', !isOn);
                controlsWrap.classList.toggle('disabled', !isOn);
            }

            function sendState(state) {
                if (window.sharedData) {
                    const devState = device_info.state;
                    const payload = {
                        id: 1,
                        state: {
                            light: devState.light,
                            mode: devState.mode,
                            h: devState.h,
                            s: devState.s,
                            l: devState.l,
                            brightness: devState.brightness,
                            white: devState.white
                        },
                    };
                    window.sharedData.MySerAdv = payload;
                } else {
                    console.warn('sharedData 不可用，无法发送状态');
                }
            }

            toggleTrack.addEventListener('click', function (e) {
                if (togglePending) {
                    console.log('⏳ 开关等待确认中，忽略本次点击');
                    return;
                }
                const devState = device_info.state;
                lastSyncedState = { ...devState };
                const newLight = devState.light === 1 ? 0 : 1;
                togglePending = true;
                this.classList.add('pending');
                devState.light = newLight;
                sendState(devState);

                if (toggleTimer) clearTimeout(toggleTimer);
                toggleTimer = setTimeout(() => {
                    if (togglePending) {
                        togglePending = false;
                        toggleTrack.classList.remove('pending');
                        devState = { ...lastSyncedState };
                        updateUIFromState(devState);
                        console.warn('⏰ 开关超时，回退到之前状态');
                    }
                }, 5000);
                console.log('📤 开关指令已发送（新状态:', newLight, '），等待确认...');
            });

            sliderHue.addEventListener('input', function () {
                const devState = device_info.state;
                devState.h = parseInt(this.value);
                valHue.textContent = String(devState.h).padStart(3, '0') + '°';
                const hex = hslToHex(devState.h, devState.s, devState.l);
                hexReadout.textContent = hex;
                dot.style.backgroundColor = hex;
                dot.style.boxShadow = `0 0 80px ${hex}80`;
                glow.style.background = `radial-gradient(circle, ${hex}30, transparent 55%)`;
            });
            sliderHue.addEventListener('change', function () {
                const devState = device_info.state;
                if (sliderPending) { clearTimeout(sliderTimer); sliderPending = false; }
                sliderRevertState = { ...lastSyncedState };
                sendState(devState);
                sliderPending = true;
                sliderTimer = setTimeout(() => {
                    if (sliderPending) {
                        sliderPending = false;
                        devState = { ...sliderRevertState };
                        updateUIFromState(devState);
                        console.warn('⏰ 滑块超时，回退到之前状态');
                    }
                }, 5000);
                console.log('📤 色相已发送:', devState.h, '，等待确认...');
            });

            sliderSat.addEventListener('input', function () {
                const devState = device_info.state;
                devState.s = parseInt(this.value);
                valSat.textContent = devState.s + '%';
                const hex = hslToHex(devState.h, devState.s, devState.l);
                hexReadout.textContent = hex;
                dot.style.backgroundColor = hex;
                dot.style.boxShadow = `0 0 80px ${hex}80`;
                glow.style.background = `radial-gradient(circle, ${hex}30, transparent 55%)`;
            });
            sliderSat.addEventListener('change', function () {
                const devState = device_info.state;
                if (sliderPending) { clearTimeout(sliderTimer); sliderPending = false; }
                sliderRevertState = { ...lastSyncedState };
                sendState(devState);
                sliderPending = true;
                sliderTimer = setTimeout(() => {
                    if (sliderPending) {
                        sliderPending = false;
                        devState = { ...sliderRevertState };
                        updateUIFromState(devState);
                        console.warn('⏰ 滑块超时，回退到之前状态');
                    }
                }, 5000);
                console.log('📤 饱和度已发送:', devState.s, '，等待确认...');
            });

            sliderLight.addEventListener('input', function () {
                const devState = device_info.state;
                devState.l = parseInt(this.value);
                valLight.textContent = devState.l + '%';
                const hex = hslToHex(devState.h, devState.s, devState.l);
                hexReadout.textContent = hex;
                dot.style.backgroundColor = hex;
                dot.style.boxShadow = `0 0 80px ${hex}80`;
                glow.style.background = `radial-gradient(circle, ${hex}30, transparent 55%)`;
            });
            sliderLight.addEventListener('change', function () {
                const devState = device_info.state;
                if (sliderPending) { clearTimeout(sliderTimer); sliderPending = false; }
                sliderRevertState = { ...lastSyncedState };
                sendState(devState);
                sliderPending = true;
                sliderTimer = setTimeout(() => {
                    if (sliderPending) {
                        sliderPending = false;
                        devState = { ...sliderRevertState };
                        updateUIFromState(devState);
                        console.warn('⏰ 滑块超时，回退到之前状态');
                    }
                }, 5000);
                console.log('📤 明度已发送:', devState.l, '，等待确认...');
            });



            // 初始化 UI
            let device_info = {
                id: 0,
                name: null,
                online: null,
                capabilities: null,
                fw_version: null,
                mac: null,
                model: null,
                state: {
                    light: 1,
                    mode: 2,
                    h: 30,
                    s: 75,
                    l: 50,
                    brightness: 100,
                    white: 125
                },
                type: null,
            };
            updateDeviceInfo(window.sharedData.device_1_info);
            if (device_info) {
                console.log('初始设备信息:', device_info);
            }


            // 日志脚本（复现原日志功能）
            (function () {
                const MAX_LOG_COUNT = 50;
                let rawLogs = [];
                let currentFilter = 'ALL';

                const logEl = document.getElementById('log');
                const logCountEl = document.getElementById('logCount');
                const logPanel = document.getElementById('logPanel');
                const logHeader = document.getElementById('logHeader');

                logPanel.classList.remove('open');

                function renderLogs() {
                    logEl.innerHTML = '';
                    const filtered = rawLogs.filter(item => currentFilter === 'ALL' || item.type === currentFilter);
                    filtered.forEach(item => {
                        const line = document.createElement('div');
                        line.className = 'log-line';
                        const timeSpan = document.createElement('span');
                        timeSpan.className = 'log-time';
                        timeSpan.textContent = item.time;
                        const badge = document.createElement('span');
                        badge.className = 'badge badge-' + item.type;
                        badge.textContent = item.type;
                        const content = document.createElement('span');
                        content.className = 'log-content';
                        let displayMsg = item.msg;
                        displayMsg = displayMsg.replace(/(\{[\s\S]*\})/g, '<span class="log-data">$1</span>');
                        content.innerHTML = displayMsg;
                        line.appendChild(timeSpan);
                        line.appendChild(badge);
                        line.appendChild(content);
                        logEl.appendChild(line);
                    });
                    logEl.scrollTop = logEl.scrollHeight;
                    logCountEl.textContent = rawLogs.length;
                }

                function addLog(type, msg) {
                    const now = new Date();
                    const time = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
                    const item = { time, type, msg };
                    rawLogs.push(item);
                    if (rawLogs.length > MAX_LOG_COUNT) rawLogs.shift();
                    if (currentFilter === 'ALL' || currentFilter === type) {
                        appendLogItem(item);
                    } else {
                        renderLogs();
                    }
                    logCountEl.textContent = rawLogs.length;
                }

                function appendLogItem(item) {
                    const line = document.createElement('div');
                    line.className = 'log-line';
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'log-time';
                    timeSpan.textContent = item.time;
                    const badge = document.createElement('span');
                    badge.className = 'badge badge-' + item.type;
                    badge.textContent = item.type;
                    const content = document.createElement('span');
                    content.className = 'log-content';
                    let displayMsg = item.msg;
                    displayMsg = displayMsg.replace(/(\{[\s\S]*\})/g, '<span class="log-data">$1</span>');
                    content.innerHTML = displayMsg;
                    line.appendChild(timeSpan);
                    line.appendChild(badge);
                    line.appendChild(content);
                    logEl.appendChild(line);
                    while (logEl.children.length > MAX_LOG_COUNT) {
                        logEl.removeChild(logEl.firstChild);
                    }
                    logEl.scrollTop = logEl.scrollHeight;
                }

                window._logPanelLog = addLog;

                // 监听 MyDeviceInfoAdvChanged,用于更新log区域显示
                if (bus) {
                    bus.addEventListener('MyDeviceInfoAdvChanged', function (e) {
                        const data = e.detail.MyDeviceInfoAdv;
                        console.log('日志信息:', data);
                        if (data.id !== 1)
                            return;
                        if (data) {
                            let display = typeof data === 'object' ? JSON.stringify(data, null, 2) : String(data);
                            addLog('RECE', display);
                        }
                    });
                }

                // 拦截 MySerAdv 赋值
                (function setupProxy() {
                    const original = window.sharedData || {};
                    const handler = {
                        set(target, prop, value) {
                            if (prop === 'MySerAdv') {
                                let display = typeof value === 'object' ? JSON.stringify(value, null, 2) : String(value);
                                addLog('SEND', display);
                                target[prop] = value;
                            } else {
                                target[prop] = value;
                            }
                            return true;
                        },
                        get(target, prop) {
                            return target[prop];
                        }
                    };
                    const proxy = new Proxy(original, handler);
                    Object.defineProperty(window, 'sharedData', {
                        get: function () { return proxy; },
                        set: function (val) { console.warn('sharedData 被重新赋值，忽略'); },
                        configurable: true
                    });
                })();



                logHeader.addEventListener('click', function (e) {
                    if (e.target.closest('.btn-tool')) return;
                    logPanel.classList.toggle('open');
                });

                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        currentFilter = this.dataset.filter;
                        renderLogs();
                    });
                });

                document.getElementById('btnClearLog').addEventListener('click', function () {
                    rawLogs = [];
                    renderLogs();
                });

                document.getElementById('btnCopyLog').addEventListener('click', async function () {
                    const text = rawLogs.map(i => `[${i.time}] [${i.type}] ${i.msg}`).join('\n');
                    try {
                        await navigator.clipboard.writeText(text);
                        addLog('INFO', '日志已复制到剪贴板');
                    } catch (e) {
                        addLog('INFO', '复制失败: ' + e.message);
                    }
                });

                addLog('INFO', '日志系统已启动，等待通信数据...');
            })();

            console.log('✅ Matrix Core 控制器已启动');
        })();
    </script>
